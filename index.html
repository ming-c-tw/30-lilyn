<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nes.css/2.3.0/css/nes.min.css" integrity="sha384-O6AjLjfUmUlVtjVwX4WKPHE+6hSARLX8hRW1n+5w6b8dY0ED4fylO/udKa4UraEf" crossorigin="anonymous">

<style>
  :root{
    --bg:#1d1f3b; --sky:#2b2d5e; --card:#fdf6e3; --ink:#212529; --muted:#6b6560;
    --brown:#8b5a2b; --red:#d7263d; --orange:#f29100; --blue:#209cee; --green:#1f8a4c;
    --gold:#f7d51d; --pink:#e76e8a;
    --px:4px;
  }
  *{box-sizing:border-box}
  html{font-size:12px;overflow-y:scroll;scrollbar-gutter:stable}  /* 右側捲動條位置一直預留，內容長短切換不跑版 */
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Fusion Pixel 12px Proportional TC","Press Start 2P","PingFang TC",system-ui,sans-serif;
    -webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;image-rendering:pixelated}
  body{min-height:100dvh;display:flex;flex-direction:column;font-size:16px;line-height:1.7;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.9) 0 1px, transparent 2px),
      radial-gradient(circle at 70% 25%, rgba(255,255,255,.7) 0 1px, transparent 2px),
      radial-gradient(circle at 45% 60%, rgba(255,255,255,.6) 0 1px, transparent 2px),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,.8) 0 1px, transparent 2px),
      radial-gradient(circle at 10% 85%, rgba(255,255,255,.5) 0 1px, transparent 2px);
    background-size:220px 220px}
  header{padding:calc(env(safe-area-inset-top) + 12px) 16px 6px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{font-size:20px;margin:0;letter-spacing:.1em;text-shadow:3px 3px 0 #000}
  header .time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000}
  /* 像素列車 */
  .rail{height:28px;position:relative;overflow:hidden;margin:0 0 8px;border-bottom:4px solid #0b0c1f}
  .rail svg{position:absolute;bottom:0;left:-120px;width:110px;height:26px;animation:ride 14s linear infinite;shape-rendering:crispEdges}
  @keyframes ride{to{transform:translateX(calc(100vw + 240px))}}
  main{flex:1;padding:0 12px 24px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
  .ticket.nes-container{background:var(--card);padding:1.6rem 1.2rem 1.2rem;position:relative}
  .ticket.nes-container.with-title>.title{background:var(--card);font-size:14px;color:var(--muted);letter-spacing:.1em}
  .station{display:flex;align-items:center;gap:10px;margin:0 0 4px;flex-wrap:wrap}
  .station .code{font-size:12px;color:#fff;background:var(--line-color,var(--blue));padding:4px 8px;box-shadow:var(--px) var(--px) 0 #000}
  .station .name{font-size:26px;letter-spacing:.08em}
  .station .name.route{font-size:19px;letter-spacing:.04em;white-space:nowrap;line-height:44px}   /* 路段關：起站 >> 到站，字縮小但列高跟一般站名一樣，版面不動 */
  .sub{color:var(--muted);font-size:14px;margin:0 0 10px}
  p{margin:8px 0}
  .nes-btn{border-image-repeat:stretch}
  .nes-btn.is-arrive{--arrive:var(--red);background:var(--arrive);color:#fff}   /* 已抵達專用：底色＝到站的路線色 */
  .nes-btn.is-arrive::after{box-shadow:inset -4px -4px color-mix(in srgb,var(--arrive),#000 28%)}
  .nes-btn.is-arrive:hover{background:color-mix(in srgb,var(--arrive),#fff 10%)}
  .nes-btn.is-arrive:focus{box-shadow:none}   /* NES.css 2.3 預設 space，邊框會變成一格一格的毛邊 */
  .btn{width:100%;margin:6px 0 0;font-size:16px}   /* NES.css 預設 margin 4px 會讓按鈕整個偏右 4px */
  .btn.small{width:auto;font-size:14px;padding:4px 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn{flex:1;width:auto}
  .nes-input{font-size:22px;text-align:center;letter-spacing:.3em;background:#fff}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  .candles{display:flex;justify-content:center;gap:12px;padding:8px 0 2px}
  .candle{width:24px;height:60px;position:relative;opacity:.3;transition:opacity .4s}
  .candle.lit{opacity:1}
  .candles.mid{gap:26px;margin:30px 0 14px}
  .candles.mid .candle{transform:scale(1.45);transform-origin:50% 100%;margin-top:28px}   /* 終局吹蠟燭／煙霧頁的 6 根 */
  .candles.big .candle{transform:scale(1.7);transform-origin:50% 100%;margin-top:42px}   /* 點亮頁的大蠟燭 */
  .candle .stick{position:absolute;bottom:0;left:6px;width:12px;height:36px;background:#f4c7a1;box-shadow:inset -4px 0 0 #d9a074, 0 4px 0 #000}
  .candle .wick{position:absolute;bottom:36px;left:11px;width:2px;height:6px;background:#333}
  .candle .flame{position:absolute;left:6px;top:2px;width:4px;height:4px;background:#ffe066;transform-origin:6px 16px;
    box-shadow:4px 0 #ffe066,0 4px #ffb703,4px 4px #ffb703,8px 4px #ffe066,0 8px #fb8500,4px 8px #ffb703,8px 8px #fb8500,4px 12px #fb8500;display:none}
  .candle.lit .flame{display:block;animation:flick .4s steps(2) infinite alternate}
  .candle.out .flame{display:none}
  .candle.ignite .flame{animation:ignite 1.5s steps(12) both,flick .4s steps(2) 1.5s infinite alternate}   /* 點亮頁：沒火 → 大火 → 縮回正常 */
  @keyframes ignite{0%,38%{transform:scale(0);filter:none}46%{transform:scale(2.8,3.2);filter:drop-shadow(0 0 10px #ffb703) drop-shadow(0 0 4px #fff)}62%{transform:scale(2.2,2.5);filter:drop-shadow(0 0 8px #ffb703)}100%{transform:none;filter:none}}
  .candle.gold{opacity:1}
  .candle.gold .stick{background:#ffd34d;box-shadow:inset -4px 0 0 #e0a800, 0 4px 0 #000}   /* 第 7 根金色蠟燭 */
  .candle.gold.lit .flame{filter:drop-shadow(0 0 4px #ff3b3b) drop-shadow(0 0 2px #ffb3b3);background:#ff6b6b;box-shadow:4px 0 #ff6b6b,0 4px #e8112d,4px 4px #e8112d,8px 4px #ff6b6b,0 8px #a4001a,4px 8px #e8112d,8px 8px #a4001a,4px 12px #a4001a}   /* 赤紅色火焰 */
  .candle.cc1 .flame{background:#ffd8a8;box-shadow:4px 0 #ffd8a8,0 4px #ff9f43,4px 4px #ff9f43,8px 4px #ffd8a8,0 8px #d9681a,4px 8px #ff9f43,8px 8px #d9681a,4px 12px #d9681a;filter:drop-shadow(0 0 4px #ff9f43)}
  .candle.cc2 .flame{background:#fff6b0;box-shadow:4px 0 #fff6b0,0 4px #ffe066,4px 4px #ffe066,8px 4px #fff6b0,0 8px #d9b21e,4px 8px #ffe066,8px 8px #d9b21e,4px 12px #d9b21e;filter:drop-shadow(0 0 4px #ffe066)}
  .candle.cc3 .flame{background:#c4f5cb;box-shadow:4px 0 #c4f5cb,0 4px #66d678,4px 4px #66d678,8px 4px #c4f5cb,0 8px #2e9e44,4px 8px #66d678,8px 8px #2e9e44,4px 12px #2e9e44;filter:drop-shadow(0 0 4px #66d678)}
  .candle.cc4 .flame{background:#c4f5f1;box-shadow:4px 0 #c4f5f1,0 4px #3ad1c8,4px 4px #3ad1c8,8px 4px #c4f5f1,0 8px #16968f,4px 8px #3ad1c8,8px 8px #16968f,4px 12px #16968f;filter:drop-shadow(0 0 4px #3ad1c8)}
  .candle.cc5 .flame{background:#c9ddff;box-shadow:4px 0 #c9ddff,0 4px #4c8df0,4px 4px #4c8df0,8px 4px #c9ddff,0 8px #2459b8,4px 8px #4c8df0,8px 8px #2459b8,4px 12px #2459b8;filter:drop-shadow(0 0 4px #4c8df0)}
  .candle.cc6 .flame{background:#ead0ff;box-shadow:4px 0 #ead0ff,0 4px #b464e6,4px 4px #b464e6,8px 4px #ead0ff,0 8px #7a32ad,4px 8px #b464e6,8px 8px #7a32ad,4px 12px #7a32ad;filter:drop-shadow(0 0 4px #b464e6)}   /* 許願頁：第 2～7 根的燭火依序變成橙黃綠青藍紫（Ming：變色的是燭火，不是蠟燭） */
  .spk{position:absolute;width:4px;height:4px;background:#ffc93c;box-shadow:4px 0 #ffc93c,-4px 0 #ffc93c,0 4px #ffc93c,0 -4px #ffc93c,0 0 6px #fff;animation:twinkle 1.2s steps(3) infinite;pointer-events:none}   /* 閃閃發光 */
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
  .gold-gift.hero,.gold-gift{position:relative;width:176px;margin:30px auto;left:-7px}   /* 列車長＋蠟燭整組看起來置中（墨墨左邊空 1 格、蠟燭超出右邊一點，往左 7px 抵掉） */
  .gg-momo svg{display:block}
  .gg-candle{position:absolute;left:119px;bottom:56px;width:70px;height:130px}
  .gg-candle{z-index:1}   /* 蠟燭疊在手前面（Ming） */   /* 金色蠟燭握在列車長伸出去的右手（手在第 13–14 欄、第 8–10 列，一格 11px） */
  .gg-candle .candle{position:absolute;left:23px;bottom:0;transform:scale(2.1);transform-origin:50% 100%;filter:drop-shadow(0 0 8px #ffd34d) drop-shadow(0 0 3px #fff)}
  .gold-big,.gold-big.hero{position:relative;width:170px;height:170px;margin:30px auto;--gp:0}   /* .hero 的 margin 會蓋掉置中，這裡一起寫 */
  .gold-big .gb-candle{position:absolute;left:73px;bottom:10px;transform:scale(2.8);transform-origin:50% 100%;filter:drop-shadow(0 0 calc(4px + 14px * var(--gp)) #ffd34d)}
  .gold-big.pulse .gb-candle{animation:gpulse .35s steps(3)}
  /* 點燃瞬間（Ming 2026-11-06）：火苗縮小 → 變成旋轉的閃光 → 炸出一圈紅圈 → 紅火點燃 */
  .gold-big.igniting .candle.gold:not(.lit) .flame{scale:0 !important;transition:scale .25s}
  .ig-flash{--fd:#a4001a;--fm:#e8112d;--fl:#ff6b6b;--fc:#ff9a9a;--flen:2600px;--fw:8px;--fdur:1.6s;position:absolute;width:0;height:0;z-index:3000;pointer-events:none;animation:igflash var(--fdur) ease-in-out forwards;filter:drop-shadow(0 0 6px var(--fm))}   /* 超長的十字閃光，中心黏在引線頂端，邊轉邊縮進引線 */
  .ig-flash i{position:absolute;left:0;top:0;width:var(--flen);height:var(--fw);transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,var(--fd) 12%,var(--fm) 38%,var(--fl) 49%,var(--fc) 50%,var(--fl) 51%,var(--fm) 62%,var(--fd) 88%,transparent)}
  .ig-flash i:nth-child(2){transform:translate(-50%,-50%) rotate(90deg)}
  .ig-flash .ig-rot{position:absolute;left:0;top:0;animation:igrot var(--fdur) linear forwards}   /* 旋轉另外一層，等速轉 */
  @keyframes igflash{0%{transform:scale(0)}45%{transform:scale(1)}100%{transform:scale(0)}}   /* 從引線伸到螢幕外，再縮回引線 */
  @keyframes igrot{from{transform:rotate(0)}to{transform:rotate(540deg)}}   /* 從引線邊慢轉邊伸到螢幕外，再轉回縮進引線（Ming：兩條交錯、不要轉太快） */
  .ig-ring{--fm:#e8112d;position:absolute;left:12px;top:10px;width:2px;height:2px;transform:translate(-50%,-50%);border:1.5px solid var(--fm);border-radius:50%;box-shadow:0 0 2px var(--fm);animation:igring .6s ease-out forwards;pointer-events:none}   /* 用寬高放大，圈線維持細細一條 */
  @keyframes igring{from{width:2px;height:2px;opacity:1}to{width:64px;height:64px;opacity:0}}
  .candle.lit.pop .flame{animation:flamepop .4s steps(4)}
  .candle.lit.shrink .flame{scale:0;transition:scale .25s}   /* 變色前先把舊火苗縮掉 */
  @keyframes flamepop{0%{scale:0}60%{scale:1.45}100%{scale:1}}
  .gold-big .candle.gold:not(.lit) .flame{display:block;background:#ff6b6b;box-shadow:4px 0 #ff6b6b,0 4px #e8112d,4px 4px #e8112d,8px 4px #ff6b6b,0 8px #a4001a,4px 8px #e8112d,8px 8px #a4001a,4px 12px #a4001a;
    scale:calc(.2 + .8 * var(--gp));filter:drop-shadow(0 0 4px #ff3b3b) drop-shadow(0 0 2px #ffb3b3);opacity:calc(var(--gp) * 100);animation:flick .4s steps(2) infinite alternate;transition:scale .25s}   /* 注入魔力時每多一格，火苗就大一點；退格也跟著變小（Ming 2026-11-06） */
  @keyframes gpulse{50%{filter:drop-shadow(0 0 22px #ffe066) brightness(1.3)}}
  .pips{display:flex;justify-content:center;gap:6px}
  .pips i{width:16px;height:16px;border:3px solid #000;background:#fff}
  .pips i.on{background:#e8112d}   /* 集氣格跟金色蠟燭的紅火同色（Ming 2026-11-06） */
  .gcam{position:absolute;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none}   /* 前鏡頭只用來偵測，不顯示畫面 */
  .wish-dim{position:fixed;inset:0;background:#000;z-index:1500;opacity:0;animation:dimin 2s ease-in forwards;pointer-events:none}   /* 蠟燭以外慢慢變暗變黑 */
  .wish-dim.leave{animation:dimout .7s ease-out forwards}
  @keyframes dimin{to{opacity:.94}}
  @keyframes dimout{from{opacity:.94}to{opacity:0}}
  .wish-front{position:relative;z-index:1600}
  .wish-row{position:relative}
  .wish-rays{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;border-radius:50%;background:conic-gradient(#ff4d6d,#ff9f43,#ffe066,#66d678,#4cc9f0,#b464e6,#ff4d6d);-webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.55) 18vmax,transparent 55vmax);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.55) 18vmax,transparent 55vmax);opacity:0;transition:opacity 1.2s;animation:raysspin 14s linear infinite;pointer-events:none}   /* 七彩柔霧光暈，以蠟燭為中心鋪滿整個螢幕（Ming 2026-11-06 選第 4 款） */
  .wish-rays.on{opacity:.9}
  @keyframes raysspin{to{transform:rotate(360deg)}}
  .wish-row .candles{position:relative}
  .wish-text{color:#fff;text-align:center;opacity:0;transition:opacity .8s;margin:14px 0;position:relative;z-index:3}   /* 文字疊在彩光最上面、純白不透明、不加黑邊（Ming 2026-11-06） */
  .wish-late{visibility:hidden}
  .wish-front.ready .wish-text{opacity:1}.wish-front.ready .wish-late{visibility:visible}
  .candle.out .smoke{position:absolute;left:10px;top:6px;width:4px;height:4px;background:#999;box-shadow:4px -6px #aaa,0 -12px #bbb;animation:rise 1.2s steps(3) infinite}
  @keyframes flick{from{transform:none}to{transform:scale(1.12,1.1)}}   /* 以火焰根部為中心晃動，不再往上飄離引線 */
  @keyframes rise{to{transform:translateY(-10px);opacity:0}}
  .msg{margin:10px 0 6px;font-size:15px}
  .letter.nes-container{background:#fff9db;font-size:15px;line-height:2;white-space:pre-wrap;margin:10px 0 14px;padding:1rem}
  .nes-input{margin:0;width:100%}
  .hint{color:var(--muted);font-size:14px}
  .tag{font-size:13px;color:var(--muted)}
  .diffwrap{position:relative;width:100%;overflow:hidden;background:#ddd;touch-action:manipulation;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000}
  .diffwrap img,.diffwrap svg{display:block;width:100%;height:auto}
  .diffwrap img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .diffwrap.zv{touch-action:none}
  /* 灰藍按鈕（忠孝復興「偵查」，Ming 指定；跟眼睛準星同色系） */
  .nes-btn.is-slate{color:#fff;background-color:#6b84a0}
  .nes-btn.is-slate::after{box-shadow:inset -4px -4px #4a5f78}
  .nes-btn.is-slate:hover{color:#fff;background-color:#5f7793}
  .nes-btn.is-slate:hover::after{box-shadow:inset -6px -6px #4a5f78}
  .nes-btn.is-slate:focus{box-shadow:0 0 0 6px rgba(107,132,160,.3)}
  .nes-btn.is-slate:active:not(.is-disabled)::after{box-shadow:inset 4px 4px #4a5f78}
  .zv .zi{position:relative;transform-origin:0 0;will-change:transform}
  .zv .xh{position:absolute;width:44px;height:44px;pointer-events:none;transform-origin:50% 50%;
    filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px rgba(0,0,0,.45))}   /* 白邊＋淡陰影：在粉紅機台上也看得清楚 */
  .mark{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border:4px solid var(--green);box-shadow:0 0 0 3px #fff;pointer-events:none}
  .mark.miss{border-color:var(--red);animation:pop .4s forwards}
  @keyframes pop{to{opacity:0;transform:scale(1.5)}}
  video{width:100%;background:#000;display:block;border:4px solid #000}
  .frame{position:relative}
  .frame.ar{isolation:isolate;aspect-ratio:1;overflow:hidden;background:#000;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000}   /* MindAR 的 video／canvas 是負 z-index，要自己的堆疊層才看得到 */
  .frame .ar-found-text{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:18px;letter-spacing:.1em;color:var(--gold);text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
  .frame .overlay.ar-found.L{left:32%;top:40%}
  .frame .overlay.ar-found.R{left:68%;top:40%}   /* 往上放，不壓到下方的字 */
  .frame .overlay.ar-found{background:transparent;border:0;padding:0;box-shadow:none;animation:fbglow .5s steps(4) infinite alternate, arbob 1.2s steps(6) infinite alternate}
  @keyframes arbob{from{transform:translate(-50%,-50%) translateY(-8px)}to{transform:translate(-50%,-50%) translateY(8px)}}   /* 命中的半片徽章上下飄 */
  .frame .reticle{position:absolute;inset:14% 12%;border:4px dashed rgba(255,255,255,.85);pointer-events:none}
  .frame .overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;color:var(--gold);padding:14px 18px;font-size:28px;letter-spacing:.4em;text-align:center;border:4px solid var(--gold);animation:fadein .6s steps(4)}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .compass{width:176px;height:176px;margin:8px auto;position:relative;background:#fff;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000}
  .compass .needle{position:absolute;left:50%;top:50%;width:8px;height:76px;margin:-76px 0 0 -4px;background:var(--red);transform-origin:50% 100%;transition:transform .2s steps(6)}
  .compass .needle.good{background:var(--green)}
  .compass .n{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;color:var(--muted)}

  .arena-clip{position:absolute;inset:0;overflow:hidden;clip-path:var(--hole);background:#140a22}   /* 底色：背景雜訊錯位時不會露出底下的紅藍邊 */

  .devil{position:absolute;right:40px;top:40px;width:112px;z-index:2;animation:devilbob .9s steps(2) infinite alternate}
  .devil svg{display:block}

  .devil .dfh{position:absolute;left:0;top:0;visibility:hidden}
  .devil.hit .df1,.devil.hit .df2{visibility:hidden!important;animation:none}

  @keyframes hitflash{0%{filter:brightness(3) saturate(0)}20%{filter:none}40%{filter:brightness(3) saturate(0)}60%{filter:none}}
  @keyframes devflip{0%{visibility:hidden}50%{visibility:visible}}   /* 兩張輪替 */

  .devil.die{animation:devildie 1.2s steps(8) forwards}
  @keyframes devilbob{from{transform:translateY(0)}to{transform:translateY(-8px)}}

  @keyframes devildie{0%{opacity:1;transform:rotate(0) scale(1)}25%{opacity:.2;transform:translateY(10px) rotate(20deg)}50%{opacity:1;transform:translateY(40px) rotate(-30deg) scale(.8)}75%{opacity:.2;transform:translateY(120px) rotate(60deg) scale(.5)}100%{opacity:0;transform:translateY(240px) rotate(180deg) scale(.1)}}
  .cat{position:absolute;left:14px;bottom:14px;width:150px;z-index:3}

  .crack svg{display:block}

  @keyframes tbfly{to{transform:translateY(-360px) rotate(720deg) scale(.3);opacity:0}}
  .dial{width:200px;height:200px;margin:34px auto 8px;position:relative;border:4px solid #000;border-radius:50%;background:radial-gradient(circle,#fff 60%,#fdf6e3 61%);box-shadow:4px 4px 0 #9a9a9a}
  .dial .mk{position:absolute;left:50%;top:50%;width:0;height:0}
  .dial .mk span{position:absolute;left:-16px;top:-96px;width:32px;height:32px;border:3px solid #000;background:#ffe066;display:flex;align-items:center;justify-content:center;font-size:18px}
  .dial .mk.flower span{background:#f4a3c0}
  .dial .mk.done span{opacity:.35}
  .dial .me{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
  .dial .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--muted)}

  .bignum{font-size:96px;line-height:1;text-align:center;margin:12px 0 24px;color:var(--blue);text-shadow:6px 6px 0 #000}
  #gamebox{margin-top:14px}
  progress.nes-progress{display:block}
  .smoke-late{animation:latein .4s steps(2) 3.4s both}   /* 字跟按鈕等數字成形後才出現 */
  @keyframes latein{from{opacity:0}to{opacity:1}}
  .smoke-wrap{text-align:center;margin:6px 0 4px}
  .smoke-num{font-size:84px;line-height:1;color:#c9ccd6;text-shadow:0 0 12px #e0e3ea,4px 4px 0 #6b6f85;letter-spacing:.08em;animation:smokein 2.6s steps(10) 1s both;filter:blur(0)}   /* 先讓蠟燭冒煙 1 秒，煙再慢慢聚成數字 */
  @keyframes smokein{0%{opacity:0;filter:blur(10px);transform:translateY(30px) scale(.6)}60%{opacity:.7;filter:blur(4px)}100%{opacity:1;filter:blur(0);transform:none}}

  .px-icon{width:1.4em;height:1.4em;vertical-align:-0.3em;display:inline-block}
  .center{text-align:center}

const STATION_COLOR = [['大安森林公園','red'],['麟光捷運站','brown'],['科技大樓','brown'],['忠孝新生','orange'],['忠孝復興','blue'],['東門','red'],['麟光','brown']];
const STATION_RE = new RegExp('(?:'+STATION_COLOR.map(x=>x[0]).join('|')+')站?','g');   // 後面接「站」也一起上色
function colorStations(root){
  const skip='button,.nes-btn,.station,input,textarea,svg,.mrt,h1,label,.npc,script,style';
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n=>{ STATION_RE.lastIndex=0; return (n.parentElement && !n.parentElement.closest(skip) && STATION_RE.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const f=document.createDocumentFragment(); let last=0; const t=n.nodeValue; STATION_RE.lastIndex=0; let m;
    while((m=STATION_RE.exec(t))){ f.appendChild(document.createTextNode(t.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='mrt'; sp.style.color=LINE[STATION_COLOR.find(x=>m[0].startsWith(x[0]))[1]]; sp.textContent=m[0]; f.appendChild(sp); last=m.index+m[0].length; }
    f.appendChild(document.createTextNode(t.slice(last))); n.replaceWith(f); });
}

/* 上一頁（2026-11-05 Ming：不靠紀錄，照關卡順序）：把這一關重設到開頭，用「下一頁」一路走、記下每一頁，找到現在這頁就退到前一頁；已經是第一頁就退到前一關的最後一頁 */
function pageKey(st){ const s=CONFIG.stages[st.stage]; if(!s) return String(st.stage);
  const ex={}; Object.keys(st.extra||{}).filter(k=>k===s.id||k.startsWith(s.id+'_')||['s7_blown','letterOpen','endLetter'].includes(k)).sort().forEach(k=>{ let v=st.extra[k];
    if(v && typeof v==='object' && !Array.isArray(v)){ const o={}; ['step','cur','boss','summoned'].forEach(f=>{ if(v[f]!=null) o[f]=v[f]; }); if(Array.isArray(v.got)) o.got=v.got.length; v=o; }
    else if(Array.isArray(v)) v=v.length; else if(typeof v==='string' && v.length>40) v='*'; ex[k]=v; });
  return JSON.stringify([st.stage, !!(st.done||{})[s.id], ex]); }
function stageStart(i){   // 回到第 i 關剛開始的狀態（後面的關全部清掉；照片不動）
  const strip=state.extra.strip;
  CONFIG.stages.slice(i).forEach(x=>clearStage(x.id));
  if(i<=CONFIG.stages.findIndex(x=>x.finalPhoto)){ delete state.extra.letterOpen; delete state.extra.endLetter; }
  state.extra.strip=strip; state.stage=i; }
function walkStage(i){   // 第 i 關從頭走到要離開這一關為止，每一頁存一份
  const pages=[]; stageStart(i); save(); render();
  for(let n=0;n<80;n++){ const sn=snapState(), key=pageKey(state); if(!pages.length || pages[pages.length-1].key!==key) pages.push({sn,key});
    const before=key; pageNext(); if(state.stage!==i) break; if(pageKey(state)===before) break; }
  return pages; }
let walking=false;
function pageBack(){
  if(walking) return; walking=true;
  const keep=JSON.stringify(state), here=pageKey(state), i=state.stage;
  try{
    const pages=walkStage(i); const pos=pages.map(p=>p.key).lastIndexOf(here);
    let target=null;
    if(pos>0) target=pages[pos-1].sn;
    else if(pos===-1 && pages.length) target=pages[0].sn;   // 找不到這頁（例如玩到一半）：回到這一關開頭
    else if(i>0){ const prev=walkStage(i-1); target=prev[prev.length-1].sn; }
    if(target){ restoreSnap(target); window.scrollTo(0,0); }
    else { const o=JSON.parse(keep); Object.keys(state).forEach(k=>delete state[k]); Object.assign(state,o); save(); render(); }
  } finally { walking=false; }
}
function pageNext(){
  const nx=document.getElementById('next'); if(nx){ nx.click(); return; }       // 過關畫面 → 前往下一站
  const nl=document.getElementById('nextl'); if(nl){ nl.click(); return; }     // 點亮蠟燭頁 → 目的地
  const wn=document.getElementById('won'); if(wn && wn.style.display!=='none'){ wn.click(); return; }   // 小遊戲打贏 → 看秘密數字
  const go=document.getElementById('go'); if(go){ go.click(); return; }          // 開場
  if(document.getElementById('fc') && !document.getElementById('gocode')){ renderSmoke(); setTimeout(recordPage,0); return; }   // 吹蠟燭 → 煙霧櫃號（跳過願望鈕）
  const gc=document.getElementById('gocode'); if(gc){ gc.click(); return; }
  const ol=document.getElementById('openletter')||document.getElementById('cert'); if(ol){ ol.click(); return; }   // 獲得一封信 → 看信 → 領取通關證明
  const s=CONFIG.stages[state.stage]; if(!s || state.done[s.id]) return;
  const step=(k,v)=>{ state.extra[k]=v; save(); render(); };
  if(s.type==='ticket_puzzle'){                                                  // 車票 → 合照 → 前往 → 拼圖 → 拼好 → 過關
    const k=s.id+'_tp', d=state.extra[k]||{step:'ticket'}, n=s.grid||3;
    if(d.step==='ticket') return step(k,{step:'photo'});
    if(d.step==='photo'){ state.extra[s.id+'_lit']=true; return step(k,{step:'lit'}); }
    if(d.step==='lit') return step(k,{step:'go'});
    if(d.step==='go'){ if(s.noPuzzle) return skipToNext(s); return step(k,{step:'puzzle', order:shuffle([...Array(n*n).keys()])}); }
    if(!d.solved){ d.order=[...Array(n*n).keys()]; d.solved=true; giveDigit(s.id); return step(k,d); }
    return skipToNext(s);
  }
  if(s.type==='photo_task'){ if(s.preStep && !state.extra[s.id+'_pre']){ state.extra[s.id+'_pre']=true; save(); return render(); } state.done[s.id]=true; save(); return render(); }
  if(s.type==='firebadge'){ const k=s.id+'_fb', d=state.extra[k]||{got:[]};
    if(!d.got.includes('winter')) d.got.push('winter'); else if(!d.got.includes('flower')) d.got.push('flower'); else { d.summoned=true; state.done[s.id]=true; }   // 左半 → 右半（兩半合成、出現解除封印）→ 解封
    state.extra[k]=d; save(); return render(); }
  if(s.type==='game'){ state.extra[s.id+'_won']=true; state.done[s.id]=true; save(); return render(); }
  if(s.type==='final'){ const fs=state.extra.s7_step;
    if(!state.extra.s7_blown && !fs){ state.extra.s7_step='inject'; state.extra.s7_gold=true; save(); return render(); }
    if(!state.extra.s7_blown && fs==='inject'){ state.extra.s7_goldLit=true; state.extra.s7_step='wish'; save(); return render(); }
    if(!state.extra.s7_blown && fs==='wish'){ state.extra.s7_step='smoke'; save(); return render(); }
    if(!state.extra.s7_blown){ state.extra.s7_blown=true; save(); return render(); } state.done[s.id]=true; state.stage=CONFIG.stages.indexOf(s)+1; save(); return render(); }
  if(s.type==='spot'){                                                           // 每張圖：看圖 → 找破綻 → 看破 → 下一張…→ 已看破全部 → 魔王（出現 → 打鬥 → 打倒）
    const k=s.id+'_quiz', d=state.extra[k]||{cur:0,step:'look'}, ph=s.photos||[s], n=ph.length;
    if(d.step==='look') return step(k,{cur:d.cur,step:'find',got:[],open:null,seqi:0});
    if(d.step==='find') return step(k,{cur:d.cur,step:d.cur>=n-1?'all':'ok',got:spotQs(ph[d.cur]).map((_,i)=>i),open:null,seqi:0});
    if(d.step==='ok') return step(k,{cur:d.cur+1,step:'look',got:[],open:null,seqi:0});
    if(d.step==='all') return step(k,{cur:d.cur,step:'boss',boss:'wait',hits:0,introDone:true});

    return pass(s);
  }
  if(s.type==='library'){                                                        // 已抵達 → 謎語 → 找書 → 過關
    const k=s.id+'_lib', st=state.extra[k]||'go';

    if(i<order.length-1) return step(k,order[i+1]);
    return pass(s);
  }
  pass(s);
}

function answerNote(s){
  const items=[];                                   // {label, value, copy}
  if(s.type==='library'){ s=libStage(s); if(s.backup) items.push({label:'用書',value:state.extra[s.id+'_bk']?'備案':'主書'}); items.push({label:'書名',value:s.book.title,copy:true},{label:`索書號後 ${s.callDigits.length} 碼`,value:s.callDigits,copy:true},{label:'ISBN 後 3 碼',value:s.bookAnswer,copy:true}); }
  else if(s.type==='firebadge'){ items.push({label:'線索',value:s.clue},{label:'過關',value:'掃牆上的〈四季〉＋戶外的〈大安之花〉'}); }
  else if(s.type==='spot'){ (s.photos||[{spots:s.spots}]).forEach((p,i)=>{
      if(p.spots){ items.push({label:`照片 ${i+1}`,value:`${p.spots.length} 處 ${p.spots.map(q=>`(${q.x},${q.y})`).join(' ')}`}); return; }
      const qs=spotQs(p); if(!qs.length) items.push({label:`虛假空間 ${i+1}`,value:'（還沒設答案）'});
      qs.forEach((x,j)=>items.push({label:`虛假空間 ${i+1}${qs.length>1?`-${j+1}`:''}`,value:x.answers[0]||'（還沒設答案）',copy:!!x.answers.length})); }); }
  else if(s.type==='game' && s.game==='song'){ s.songs.forEach((x,i)=>items.push({label:`第 ${i+1} 首`,value:x.answers[0],copy:true})); }
  else if(s.type==='ticket_puzzle'){ items.push({label:'過關',value:'合照上傳就點蠟燭'}); }
  else if(s.type==='photo_task'){ items.push({label:'過關',value:s.preStep?`先按「${s.preStep.button}」再上傳合照`:'上傳合照就過'}); }
  else if(s.type==='director'){ items.push({label:'過關',value:'按「IG 總編給過」'}); }
  else if(s.type==='final'){ items.push({label:'櫃號',value:CONFIG.lockerNumber,copy:true},{label:'密碼',value:CODE_ORDER.map(k=>CONFIG.digits[k]).join(''),copy:true}); }
  if(!items.length) return '';
  return `<div class="ans">${items.map(it=>`<div class="ans-row"><span class="tag">${it.label}：<b>${it.value}</b></span>${it.copy?`<button class="nes-btn btn small copy" data-copy="${it.value}">複製</button>`:''}</div>`).join('')}</div>`;
}

  const fbGive=key=>{ SND.sfx('badge'); stopCamera(); const k=s.id+'_fb', d=state.extra[k]||{got:[]}; if(!d.got.includes(key)) d.got.push(key); state.extra[k]=d; save(); render(); };

let photoAdj=null;   // 正在調整哪一張照片（key）；換頁或重畫別張就自動關掉
function photoFrame(key, extra=''){ const it=(state.extra.strip||{})[key]; if(!it||!it.url) return '';
  const on=photoAdj===key;
  return `<div class="pframe ${on?'adj':''}" data-k="${key}" style="background-image:url(${it.url});background-position:${(it.ox??.5)*100}% ${(it.oy??.5)*100}%;${extra};margin-bottom:8px"><button class="px" data-del="${key}" aria-label="刪掉照片">✕</button></div>

function bindPframes(root, onEnd){
  (root||document).querySelectorAll('.pframe[data-k]').forEach(el=>{ const key=el.dataset.k, it=(state.extra.strip||{})[key]; if(!it||!it.url) return;
    let iw=0, ih=0; const im=new Image(); im.onload=()=>{ iw=im.width; ih=im.height; }; im.src=it.url;
    let st=null;
    el.addEventListener('pointerdown',e=>{ if(e.target.closest('.px')||!iw||!el.classList.contains('adj')) return; e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); st={x:e.clientX,y:e.clientY,ox:it.ox??.5,oy:it.oy??.5}; });
    el.addEventListener('pointermove',e=>{ if(!st) return; const fw=el.clientWidth, fh=el.clientHeight, r=Math.max(fw/iw, fh/ih), ovx=iw*r-fw, ovy=ih*r-fh;
      it.ox=ovx>0.5?Math.min(1,Math.max(0,st.ox-(e.clientX-st.x)/ovx)):.5; it.oy=ovy>0.5?Math.min(1,Math.max(0,st.oy-(e.clientY-st.y)/ovy)):.5;
      el.style.backgroundPosition=`${it.ox*100}% ${it.oy*100}%`; });
    const end=()=>{ if(!st) return; st=null; el.classList.remove('drag'); save(); if(onEnd) onEnd(key); };
    el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); });
  (root||document).querySelectorAll('[data-padj]').forEach(b=>b.onclick=()=>{ photoAdj=photoAdj===b.dataset.padj?null:b.dataset.padj; render(); });

/* 相機與 QR */
let stream=null;
async function openCamera(container, facing='environment'){
  stopCamera();
  const v=el('<video playsinline muted autoplay></video>');
  container.innerHTML=''; container.appendChild(v);
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing }, audio:false });
    v.srcObject=stream; await v.play();
    return v;
  }catch(e){
    container.innerHTML = bad('打不開相機：'+(e.message||e)+'。要用 https 或加到主畫面，並允許相機。');
    return null;
  }
}
function stopCamera(){ if(colorTimer){ clearInterval(colorTimer); colorTimer=null; } if(arMind){ try{ arMind.stop(); }catch(e){} arMind=null; const c=document.getElementById('cam'); if(c) c.classList.remove('ar'); } if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
/* 顏色辨識：每 200ms 抓一張小圖，算粉紅／紅／藍像素比例；連續 3 次符合才算找到 */
let colorTimer=null;
function colorScan(video, spec, onFound){
  const dbg=window.__ARC={stage:'顏色辨識中',found:0,t0:Date.now(),pink:0,red:0,blue:0,ok:0};
  let box=document.getElementById('ardbg2'); if(!box){ const b1=document.getElementById('ardbg'); if(b1){ box=document.createElement('p'); box.className='tag'; box.id='ardbg2'; box.style.margin='4px 0 0'; b1.after(box); } }
  const show=()=>{ if(box) box.textContent=`花：${dbg.stage}｜粉 ${(dbg.pink*100).toFixed(1)}% 紅 ${(dbg.red*100).toFixed(1)}% 藍 ${(dbg.blue*100).toFixed(1)}%｜連續 ${dbg.ok}｜${Math.round((Date.now()-dbg.t0)/1000)}s`; };
  const c=document.createElement('canvas'); c.width=96; c.height=96; const g=c.getContext('2d',{willReadFrequently:true});
  const hsl=(r,gg,b)=>{ r/=255; gg/=255; b/=255; const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), l=(mx+mn)/2; if(mx===mn) return [0,0,l]; const d=mx-mn, sat=l>.5? d/(2-mx-mn) : d/(mx+mn); let h; if(mx===r) h=((gg-b)/d+(gg<b?6:0)); else if(mx===gg) h=(b-r)/d+2; else h=(r-gg)/d+4; return [h*60,sat,l]; };
  if(colorTimer) clearInterval(colorTimer);
  colorTimer=setInterval(()=>{
    if(!video.videoWidth){ return; }
    const vw=video.videoWidth, vh=video.videoHeight, m=Math.min(vw,vh);
    g.drawImage(video,(vw-m)/2,(vh-m)/2,m,m,0,0,96,96); const d=g.getImageData(0,0,96,96).data;
    let pink=0, red=0, blue=0, n=96*96;
    for(let i=0;i<d.length;i+=4){ const [h,sat,l]=hsl(d[i],d[i+1],d[i+2]); if(sat<.25) continue;
      if(h>=285 && h<=345 && l>.35) pink++; else if((h>=345||h<=12) && l>.2 && l<.7) red++; else if(h>=195 && h<=250 && l>.2) blue++; }
    dbg.pink=pink/n; dbg.red=red/n; dbg.blue=blue/n;
    const hit = dbg.pink>=spec.pink && dbg.red>=spec.red && dbg.blue<=spec.blueMax;
    dbg.ok = hit? dbg.ok+1 : 0; show();
    if(dbg.ok>=2){ clearInterval(colorTimer); colorTimer=null; dbg.found=1; dbg.stage='找到'; show(); onFound(); if(window.__AR){ window.__AR.by='顏色'; } }
  },200);
}
/* 預載：進到這一關就先把引擎（3 MB）跟目標檔抓下來，按掃描時立刻能用 */
const arBlob={};
async function arPreload(mindUrl){
  try{ if(!arThree) arThree = await import('./vendor/mindar/mindar-image-three.prod.js'); }catch(e){}
  if(mindUrl && !arBlob[mindUrl]){ try{ const r=await fetch(mindUrl); arBlob[mindUrl]=URL.createObjectURL(await r.blob()); }catch(e){} }
}
/* MindAR 影像辨識（官方 three.js 流程）：MindARThree 自己開相機、載目標、跑辨識，認出任何一張就 onFound */
let arMind=null, arThree=null;
async function arScan(container, mindUrl, onFound){
  const dbg=window.__AR={stage:'載入引擎',found:0,t0:Date.now()};
  const box=document.getElementById('ardbg'); const show=()=>{ if(box) box.textContent=`AR：${dbg.stage}｜命中 ${dbg.found}${dbg.by?'（'+dbg.by+'）':''}｜${Math.round((Date.now()-dbg.t0)/1000)}s`; };
  show();
  if(!arThree) arThree = await import('./vendor/mindar/mindar-image-three.prod.js');   /* 自己放：worker 要同網域 */
  // 目標檔自己先抓（顯示下載 %），抓完用 blob 交給 MindAR；預載過就直接用
  let blobUrl=arBlob[mindUrl];
  if(!blobUrl){
  const res=await fetch(mindUrl); const total=+res.headers.get('content-length')||0; const reader=res.body.getReader(); const chunks=[]; let got=0;
  while(true){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length; dbg.stage=`下載目標 ${total?Math.round(got/total*100)+'%':Math.round(got/1024)+'KB'}`; show(); }
  blobUrl=URL.createObjectURL(new Blob(chunks)); arBlob[mindUrl]=blobUrl; }
  dbg.stage='啟動相機'; show();
  container.innerHTML=''; container.classList.add('ar');
  const m=new arThree.MindARThree({ container, imageTargetSrc: blobUrl, uiLoading:'no', uiScanning:'no', uiError:'no', warmupTolerance: 5, missTolerance: 5 });   // warmup 拉高一點，減少誤判
  arMind=m;
  for(let i=0;i<8;i++){ try{ const an=m.addAnchor(i); an.onTargetFound=()=>{ dbg.found++; show(); onFound(i); }; }catch(e){ break; } }
  await m.start(); dbg.stage='辨識中'; show();
  const tick=()=>{ if(!arMind) return; show(); setTimeout(tick,500); }; tick();
}
function scanQR(container, onText){
  openCamera(container).then(v=>{
    if(!v) return;
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!stream) return;
      if(v.readyState===v.HAVE_ENOUGH_DATA){
        c.width=v.videoWidth; c.height=v.videoHeight; ctx.drawImage(v,0,0);
        const img=ctx.getImageData(0,0,c.width,c.height);
        const q = window.jsQR ? jsQR(img.data,img.width,img.height) : null;
        if(q && q.data){ if(onText(q.data)){ stopCamera(); return; } }
      }
      requestAnimationFrame(tick);
    };
    tick();
  });
}
function snapshot(v){ const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); return c; }

/* =========================================================
   各關渲染
   ========================================================= */
/* ===== 音效／配樂（2026-11-06）：音檔由 Codex 製作，放 audio/bgm|sfx/*.mp3；檔案不存在就安靜略過 =====
   SND.bgm(name)：切背景音樂（同一首不重啟、淡出舊的）；SND.sfx(name)：放一次音效；SND.page()：依目前頁面挑 BGM
   開關存在 state.extra.sound（預設開）。手機要先有一次觸控才能出聲，所以第一次 pointerdown 再真正播 */
const SND=(()=>{
  const base='audio/'; const cache={}; let cur=null, curName='', unlocked=false, pending='';
  const on=()=>state.extra.sound!==false;
  const el=(kind,name)=>{ const k=kind+'/'+name; if(!cache[k]){ const a=new Audio(base+k+'.mp3'); a.preload='auto'; a.onerror=()=>{ cache[k]=null; }; cache[k]=a; } return cache[k]; };
  const fade=(a,to,ms,done)=>{ const from=a.volume, t0=performance.now(); const tick=()=>{ const r=Math.min(1,(performance.now()-t0)/ms); a.volume=from+(to-from)*r; if(r<1) requestAnimationFrame(tick); else if(done) done(); }; tick(); };
  /* 背景音樂也走 Web Audio（解碼後循環播放，GainNode 控音量）：手機上 <audio> 常被擋、iOS 也不吃 volume，
     音效那條已證實會響，所以 BGM 跟著走同一條（Ming 2026-11-10：手機只聽到音效、沒有背景音樂）。拿不到 AudioContext 或 file: 才退回 <audio>。 */
  const bgBufs={};
  function loadBgm(name){ if(bgBufs[name]) return bgBufs[name]; const c=ctx(); if(!c||location.protocol==='file:') return Promise.resolve(null);
    return bgBufs[name]=fetch(base+'bgm/'+name+'.mp3').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(ab=>new Promise((res,rej)=>c.decodeAudioData(ab,res,rej))).catch(()=>{ delete bgBufs[name]; return null; }); }
  function waTrack(c,buf,loop){ const g=c.createGain(); g.gain.value=0; g.connect(c.destination); const s=c.createBufferSource(); s.buffer=buf; s.loop=loop; s.connect(g); s.start(0); let dead=false; s.onended=()=>{ dead=true; };
    const vol=(v,ms)=>{ const t=c.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(v,t+ms/1000); };
    return { vol, loop, get dead(){ return dead; }, stop(ms){ vol(0,ms); setTimeout(()=>{ try{ s.stop(); }catch(e){} g.disconnect(); },ms+60); }, pause(){}, play(){} }; }
  function elTrack(name,loop){ const a=el('bgm',name); if(!a) return null; a.loop=loop; a.currentTime=0; a.volume=0;
    const t={ el:a, loop, get dead(){ return a.paused; }, vol(v,ms){ fade(a,v,ms); }, stop(ms){ fade(a,0,ms,()=>a.pause()); }, pause(){ a.pause(); }, play(){ if(a.paused) a.play().then(()=>fade(a,ducked?DUCKV:VOL,600)).catch(()=>{}); } };
    a.play().then(()=>fade(a,ducked?DUCKV:VOL,600)).catch(()=>{}); return t; }
  /* 背景音樂巡檢（Ming 2026-11-10：控制台速通後拼圖頁只有音效沒音樂，電腦重現不出來）：
     該有音樂卻沒在播（載入失敗退回被擋的 <audio>、循環音軌意外停掉、沒有音軌）就重播一次 */
  let loading='';
  setInterval(()=>{ if(!on()||!unlocked||!curName||document.hidden||loading) return;
    if(!cur || (cur.loop && cur.dead)){ const n=curName; if(cur){ cur.stop(0); cur=null; } curName=''; bgm(n); } },2500);
  function bgm(name){ if(name===curName) return; curName=name; if(!on()||!unlocked){ pending=name; return; } pending='';
    if(cur){ cur.stop(500); cur=null; }
    if(!name) return; const loop=name!=='victory';
    loading=name; loadBgm(name).then(buf=>{ if(loading===name) loading=''; if(curName!==name || cur || !on()) return; const c=ctx();
      if(buf && c){ if(c.state!=='running') c.resume().catch(()=>{}); cur=waTrack(c,buf,loop); cur.vol(ducked?DUCKV:VOL,600);
        Object.keys(bgBufs).forEach(k=>{ if(k!==name) delete bgBufs[k]; }); }   // 解碼後一首十幾 MB，只留正在播的
      else if(!c || location.protocol==='file:') cur=elTrack(name,loop); }); }   // 有 Web Audio 但這次抓／解碼失敗：不退回會被手機擋的 <audio>，留空讓巡檢 2.5 秒後重試
  let ducked=false; const VOL=.55, DUCKV=.1;
  function duck(on){ ducked=!!on; if(cur) cur.vol(ducked?DUCKV:VOL, 400); }
  /* 音效走 Web Audio：先把 mp3 解碼成 AudioBuffer 放記憶體，播的時候零延遲（2026-11-07 Ming：音效會 lag）。
     解碼好之前（或 file: 本機測試 fetch 不到）退回 <audio> 複製播放。 */
  let ac=null; const bufs={};
  const ctx=()=>{ if(!ac){ const C=window.AudioContext||window.webkitAudioContext; if(C) try{ ac=new C(); }catch(e){} } return ac; };
  function load(name){ if(name in bufs) return Promise.resolve(bufs[name]); bufs[name]=null; const c=ctx(); if(!c||location.protocol==='file:') return Promise.resolve(null);
    return fetch(base+'sfx/'+name+'.mp3').then(r=>r.arrayBuffer()).then(ab=>new Promise((res,rej)=>c.decodeAudioData(ab,res,rej))).then(b=>{ bufs[name]=b; return b; }).catch(()=>null); }
  const SFX_ALL=['breakdown','invite','ticket','fairy','telescope','yum','mystery','director','aura','gift','gold_ignite','wish_n1','wish_n2','wish_n3','wish_n4','wish_n5','wish_n6','wish','finale','click','correct','wrong','candle_lit','candle_blow','digit','shutter','train','card_flip','ball_hit','jump','cat','punch','devil','glitch','charge','ignite','rainbow','smoke','locker','heart','page','growl','win','badge','merge','unseal','throw','land','rift','defeat','rift_close','fall','bump','pop','exile','trap','arrow','arrow_bad','escape','banish','heal','dim','purr','gauge_full','ult_spin','ult_slam','grip','shake','grip_free'];
  function preload(){ let i=0; const next=()=>{ if(i>=SFX_ALL.length) return; load(SFX_ALL[i++]).then(()=>setTimeout(next,30)); }; next(); }
  function sfx(name,vol=.9){ if(!on()||!unlocked) return; const c=ctx(), b=bufs[name];
    if(c&&b){ if(c.state==='suspended') c.resume().catch(()=>{}); const src=c.createBufferSource(); src.buffer=b; const g=c.createGain(); g.gain.value=vol; src.connect(g); g.connect(c.destination); src.start(0); return; }
    load(name); const a=el('sfx',name); if(!a) return; const cl=a.cloneNode(); cl.volume=Math.min(1,vol);   /* <audio> 音量只能 0～1（Web Audio 可以 >1），手機還沒解碼完時會走這條 */ cl.play().catch(()=>{}); }
  function toggle(){ state.extra.sound=!on(); save(); if(!on()){ if(cur){ cur.stop(0); cur=null; } pending=curName; curName=''; } else { unlocked=true; const n=pending||curName; curName=''; bgm(n||page(true)); } }
  function page(justName){   // 依目前關卡／步驟挑 BGM
    const s=CONFIG.stages[state.stage]; let n='travel';
    if(!state.started && state.stage===0 && !state.done.s0) n='title';
    else if(s.type==='game'){ n={g1:'volley',g2:'travel',g3:'travel',g4:'runner',g5:'puzzle'}[s.id]||'travel'; if(state.extra[s.id+'_won']) n='travel'; }
    else if(s.type==='library') n='puzzle';
    else if(s.type==='firebadge') n='adventure';
    else if(s.finalPhoto||s.id==='s9') n='birthday';
    else if(s.type==='director') n='fashion';   // 導演關：時尚伸展台（Ming 2026-11-10）
    else if(s.type==='photo_task') n='cute';
    else if(s.type==='spot'){ const d=state.extra[s.id+'_quiz']||{}; n=d.step==='boss'?(state.extra[s.id+'_won']||d.boss==='won'?'victory':'boss'):'eerie'; if(state.done[s.id]) n='travel'; }
    else if(s.type==='final'){ n=state.extra.s7_blown?'final':(state.extra.s7_step==='wish'||state.extra.s7_step==='smoke')?'final':'final'; }
    else if(s.type==='ticket_puzzle') n=state.extra.s0_tp?'travel':'title';
    if(document.querySelector('#main .stripwrap')) n='birthday';
    if(justName) return n; bgm(n); }
  /* 手機只承認「手指放開／點擊／按鍵」是使用者操作（按下的瞬間不算），所以每種都試著解鎖；
     背景音樂被擋過（paused）就在下一次操作重播。boss 單關一開頁就有音樂在等，之前只在 pointerdown 試一次就永遠沒聲音（Ming 2026-11-10） */
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   // iOS 17+：靜音鍵開著也照樣出聲
  const unlock=()=>{ const c=ctx();
    if(c){ if(c.state!=='running') c.resume().catch(()=>{}); try{ const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0); }catch(e){} }
    if(!on()) return;
    if(!unlocked){ unlocked=true; const n=pending||curName; curName=''; if(n) bgm(n); return; }
    if(cur && !document.hidden) cur.play(); };
  ['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,unlock,{capture:true}));

const PERMS={

    ${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}`);
  const wrap=$('#diff');
  found.forEach(i=>{ const p=ph.spots[i]; wrap.appendChild(el(`<div class="mark" style="left:${p.x}%;top:${p.y}%"></div>`)); });
  wrap.onclick=(e)=>{
    const r=wrap.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;

      if(found.length>=ph.spots.length && cur>=photos.length-1) setTimeout(()=>pass(s),500); else setTimeout(render,500); }
    else { const m=el(`<div class="mark miss" style="left:${x}%;top:${y}%"></div>`); wrap.appendChild(m); setTimeout(()=>m.remove(),450); }

  T(3950,()=>arena.animate([{height:'340px'},{height:'140px'}],{duration:450,easing:'ease-in-out',fill:'forwards'}));   // 場地收矮，胖貓停到一般圖示的位置

/* 次元之握：手臂、手掌、3 根彎爪與對側拇指共用一塊紫色剪影。

const GRIP_SK={
  // 從左側手腕沿掌根、3 根彎爪、右側拇指回到手腕；尖端就是輪廓的一部分。
  outline:[[18,24],[8,29],[-1,40],[-5,57],[-5,77],[-1,92],[8,102],[22,104],
    [33,99],[46,98],[57,99],[62,101],[58,108],[70,103],[75,97],[73,92],[66,87],[55,84],[43,82],[29,82],[16,85],
    [20,77],[36,76],[51,77],[62,79],[66,82],[62,88],[75,82],[81,75],[79,68],[71,62],[56,58],[40,56],[26,56],[15,60],
    [17,51],[33,49],[48,49],[60,53],[66,58],[63,63],[74,59],[80,53],[79,47],[71,40],[58,35],[42,32],[27,33],[18,36],
    [26,26],[43,22],[60,24],[78,31],[92,41],[99,53],[99,65],[94,75],[86,81],[81,81],
    [90,89],[101,85],[110,76],[114,62],[112,48],[106,37],[94,28],[76,19],[56,14]],
  // 陰影集中在掌根的小塊轉折面，不沿手指畫條紋或指節。
  shadows:[[[0,80],[9,80],[14,91],[22,97],[14,99],[5,94],[1,88]]],
  light:[[7,34],[16,29],[25,27],[18,34],[11,44],[7,50],[5,43]]
};
function drawGrip(arena, catEl, hx, hy){
  const PX=3, ar=arena.getBoundingClientRect(), cr=catEl.getBoundingClientRect();
  const W=Math.ceil(ar.width/PX), H=Math.ceil(ar.height/PX), cx=cr.left-ar.left, cy=cr.top-ar.top;
  const map=([x,y])=>[(cx+x*cr.width/100)/PX,(cy+y*cr.height/100)/PX];
  const hand=[hx/PX,hy/PX], wrist=map([37,19]), dx=wrist[0]-hand[0], dy=wrist[1]-hand[1], len=Math.hypot(dx,dy)||1;
  const contour=GRIP_SK.outline.map(map), normal=[-dy/len,dx/len];
  // 兩側由窄能量源平順漸粗到手腕，與掌指一起封閉，只填一次。
  const armSide=(end,side)=>Array.from({length:13},(_,i)=>{
    const t=i/12, s=1-t, start=hand.map((v,k)=>v+normal[k]*side*1.5);
    const control=start.map((v,k)=>v+(end[k]-v)*.56+normal[k]*side*2);
    return start.map((v,k)=>s*s*v+2*s*t*control[k]+t*t*end[k]);

  const mk=cls=>{ const cv=document.createElement('canvas'); cv.width=W; cv.height=H; cv.className='clawcv '+cls;
    cv.style.width=W*PX+'px'; cv.style.height=H*PX+'px'; cv.setAttribute('aria-hidden','true'); return cv; };
  const inside=(pts,x,y)=>{
    let hit=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      const a=pts[i], b=pts[j]; if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) hit=!hit;
    } return hit;
  };
  const back=mk('back'), front=mk('front');

  const shadows=GRIP_SK.shadows.map(p=>p.map(map)), light=GRIP_SK.light.map(map);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!inside(outline,x+.5,y+.5)) continue;
    const nx=((x+.5)*PX-cx)/cr.width*100, ny=((y+.5)*PX-cy)/cr.height*100;
    // 同一像素只屬於一層；掌指繞到貓前，手臂與拇指根部留在貓後。
    const li=ny>=30+Math.max(0,nx-75)*.35?1:0;
    mask[y*W+x]=li+1;
    const shade=shadows.some(p=>inside(p,x+.5,y+.5))?0:inside(light,x+.5,y+.5)?2:1;
    layers[li].cells.push({x,y,shade,dist:Math.hypot(x-hand[0],y-hand[1])});
  }
  // 只對整隻爪的外側空格加紅綠光；分層邊界和內部明暗都不描線。
  const has=(x,y)=>x>=0 && y>=0 && x<W && y<H?mask[y*W+x]:0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(has(x,y)) continue;
    for(let r=1;r<=2;r++){
      const upper=has(x+r,y)||has(x,y+r), lower=has(x-r,y)||has(x,y-r), owner=upper||lower;
      if(owner){
        layers[owner-1].glow.push({x,y,col:upper?'#05d9e8':'#ff2a6d',alpha:r===1?.55:.15,dist:Math.hypot(x-hand[0],y-hand[1])});

  catEl.after(back); arena.appendChild(front);
  const born=performance.now(), reach=Math.max(1,...layers.flatMap(l=>[...l.cells,...l.glow].map(p=>p.dist))), center=map([50,67]);
  let broken=null, raf=0, last=-Infinity;
  const paint=now=>{
    if(!back.isConnected || !front.isConnected){ back.remove(); front.remove(); return; }
    if(now-last<40){ raf=requestAnimationFrame(paint); return; } last=now;
    const age=now-born, grow=Math.min(1,age/380), burst=broken===null?0:Math.min(1,(now-broken)/450);
    layers.forEach(({ctx,cells,glow})=>{
      ctx.clearRect(0,0,W,H);
      const pixel=(p,col,alpha)=>{
        if(p.dist>reach*grow) return;
        let x=p.x, y=p.y;
        if(burst){
          // 以 2×2 方塊為碎片，沿巨掌向外飛散，保持像素硬邊。
          const bx=Math.floor(x/2), by=Math.floor(y/2), seed=(bx*7+by*11)%17;

      glow.forEach(p=>pixel(p,p.col,p.alpha*(.82+.18*Math.sin(age*.008+p.dist*.18))));
      // 整隻同一種半透明紫色；只用小面積陰影塑形，不另畫爪尖、指甲或分隔線。
      const colors=['#3a133d','#a858c5','#b86bd0'];
      cells.forEach(p=>pixel(p,colors[p.shade],p.shade===0?.4:.48)); ctx.globalAlpha=1;
    });

  };

  return {set:o=>[back,front].forEach(cv=>cv.style.opacity=o),brk:()=>{
    if(broken!==null) return; broken=performance.now(); [back,front].forEach(cv=>cv.classList.add('break'));
    setTimeout(()=>{ cancelAnimationFrame(raf); back.remove(); front.remove(); },450);
  }};
}

function haversine(a,b,c,d){ const R=6371000, toR=x=>x*Math.PI/180; const dLat=toR(c-a), dLng=toR(d-b); const h=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

    else { if(v===s.bookAnswer||(s.bookAnswerAlt||[]).includes(v)) pass(s); else $('#res').innerHTML=oops('不是這本，再看一次書背的 ISBN。'); } };

        c.onclick=(e)=>{
          const r=c.getBoundingClientRect(); const x=Math.floor((e.clientX-r.left)/r.width*c.width), y=Math.floor((e.clientY-r.top)/r.height*c.height);
          const d=c.getContext('2d').getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data; let R=0,G=0,B=0,n=0; for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;}
          const hsl=rgb2hsl(R/n,G/n,B/n); const diff=Math.min(Math.abs(hsl.h-s.targetHue),360-Math.abs(hsl.h-s.targetHue));

function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const M=Math.max(r,g,b),m=Math.min(r,g,b); let h=0,s=0,l=(M+m)/2; if(M!==m){ const d=M-m; s=l>.5?d/(2-M-m):d/(M+m); h = M===r?((g-b)/d+(g<b?6:0)) : M===g?((b-r)/d+2) : ((r-g)/d+4); h*=60; } return {h,s,l}; }

/* 置中裁成 1:1 */
function ratioCrop(dataUrl, w, h, cb){   // 裁成 w:h（拍貼每格 4:3），置中取景
  const im=new Image(); im.onload=()=>{ let cw=im.width, ch=Math.round(im.width*h/w); if(ch>im.height){ ch=im.height; cw=Math.round(im.height*w/h); }
    const k=Math.min(1,1200/cw); const c=document.createElement('canvas'); c.width=Math.round(cw*k); c.height=Math.round(ch*k);
    c.getContext('2d').drawImage(im,(im.width-cw)/2,(im.height-ch)/2,cw,ch,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.9)); }; im.src=dataUrl; }
function squareCrop(dataUrl, size, cb){ shrink(dataUrl, 1400, cb); }   // 2026-11-05 改存原圖（長邊 1400），裁切位置另存 ox/oy，拍貼與照片框照位置裁（Ming：要能手動拉位置）
function _oldSquareCrop(dataUrl, size, cb){ ratioCrop(dataUrl, 4, 3, cb); }   // 舊呼叫點一律走 4:3（拍貼每格 4:3，Ming 2026-11-04）const im=new Image(); im.onload=()=>{ const m=Math.min(im.width,im.height); const c=document.createElement('canvas'); c.width=c.height=Math.min(size,m); c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.88)); }; im.src=dataUrl; }
function shrink(dataUrl, max, cb){ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*k|0; c.height=im.height*k|0; c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8)); }; im.src=dataUrl; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } if(a.every((v,i)=>v===i)) [a[0],a[1]]=[a[1],a[0]]; return a; }
let actx=null;
function playTone(i){ // 示意音：正式版換成現場錄的到站音 audio 檔
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const seqs=[[523,659,784],[659,523,440,659],[784,784,659]]; let t=actx.currentTime; seqs[i].forEach(f=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.28); o.start(t); o.stop(t+.3); t+=.32; }); }catch(e){}
}

  clearInterval(rbTimer);

  const mark=(ci)=>{ rb.found.push(ci); state.extra[k]=rb; save(); if(rb.found.length>=rb.colors.length){ clearInterval(rbTimer); setTimeout(()=>pass(s),400); } else render(); };
  const o=$('#open'); if(o) o.onclick=async()=>{

        const d=c.getContext('2d').getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data; let R=0,G=0,B=0,n=0; for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;}

      const grad=g.createLinearGradient(0,H-band,0,H); grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,.75)'); g.fillStyle=grad; g.fillRect(0,H-band,W,band);

/* 火焰徽章：輪盤兩個方位 → AR 掃到兩半 → 合體 → 召喚火焰小精靈點亮蠟燭 */

      let lastAbs=0;

      $('#cam').appendChild(el(`<div class="ar-found-text">找到${key==='winter'?'左':'右'}半邊了</div>`));                                     // 字置中在下方（el() 只回第一個元素，要分開加）
      sc.textContent='收下徽章'; sc.disabled=false; sc.className='nes-btn is-primary btn';                                   // 按了才跳下一步
      sc.onclick=()=>{ stopCamera(); d.got.push(key); state.extra[k]=d; save(); render(); }; };   // 兩半都到手後不自動解封，要點徽章

        if(window.__AR) window.__AR.by='影像#'+i; found(key); }); v=arMind && arMind.video;
      if(flower && v) colorScan(v, flower.color, ()=>{ if(window.__AR) window.__AR.by='顏色'; found(flower.key); });
    }catch(e){ $('#cam').appendChild(el(`<div class="overlay" style="font-size:13px">辨識啟動失敗：${e.message||e}</div>`)); sc.textContent='再試一次'; sc.disabled=false; }
  };
  const sm=$('#summon'); if(sm) sm.onclick=()=>{ SND.sfx('unseal'); d.summoned=true; state.extra[k]=d; state.done[s.id]=true; save(); render(); };

/* 小遊戲關：玩贏 → 獲得數字 → 已抵達下一站 */

  const nx=CONFIG.stages[idx+1], nth=CODE_ORDER.indexOf(s.id)+1;
  if(won && shown && state.extra[s.id+'_arrive']) return arrivePage(s,idx);
  if(won && shown){
    main.innerHTML = ticket(s, `${steps()}
      ${ok('獲得秘密數字')}

    ${backupScanBox()}${npcBox(s,idx)}`);
  $('#won').onclick=()=>{ state.extra[s.id+'_shown']=true; giveDigit(s.id); save(); render(); };   // 數字到秘密數字頁才填進上方
  if(!won){

    gameCleanup = MiniGames[s.game]($('#gamebox'), cfg, ()=>{ state.extra[s.id+'_won']=true; state.done[s.id]=true; save(); $('#won').style.display=''; });   // 遊戲畫面留著，只冒出「已過關」

/* 7 終局：密碼鎖 → 吹蠟燭 → 櫃號 */

    main.innerHTML = ticket(s, `${steps()}
      <p>回麟光的車上，跟列車長打一場排球。贏了拿最後 1 碼。</p>
      <div id="gamebox"></div>${backupScanBox()}${npcBox(s,idx)}`);

  if(!state.extra.s7_blown){ const st=state.extra.s7_step;        // 2026-11-05 Ming：金色蠟燭 → 注入魔力 → 七根許願吹熄 → 煙霧
    if(!st) return renderGoldGift(s); if(st==='inject') return renderGoldInject(s); if(st==='wish') return renderWish(s); return renderSmoke(); }
  return renderLocker();                                          // 2026-11-03 Ming：置物櫃由真人去開，App 不做轉盤（轉盤程式留在下面當備案）
  const expect = CODE_ORDER.map(k=>CONFIG.digits[k]).join('');
  const dial = state.extra.s7_dial || [0,0,0,0,0];
  main.innerHTML = ticket(s, `${steps()}
    <p>置物櫃 <span class="big">${CONFIG.lockerNumber}</span> 號。把妳在車上拿到的 5 碼轉出來，打開它。</p>
    <div class="dials" id="dials">${dial.map((v,i)=>`<div class="dial"><button data-i="${i}" data-d="1">▲</button><div class="v">${v}</div><button data-i="${i}" data-d="-1">▼</button></div>`).join('')}</div>
    <div id="res"></div><button class="nes-btn is-primary btn" id="chk" style="margin-top:6px">轉開</button>
    ${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}`);
  $('#dials').onclick=(e)=>{ const b=e.target.closest('button'); if(!b) return; const i=+b.dataset.i, d=+b.dataset.d; dial[i]=(dial[i]+d+10)%10; state.extra.s7_dial=dial; save(); b.parentElement.querySelector('.v').textContent=dial[i]; };
  $('#chk').onclick=()=>{ if(dial.join('')===expect) renderLocker(); else $('#res').innerHTML=oops('還沒對。順序就是妳拿到的順序。'); };
  bindHints(s); bindBackupScan(s); bindNpc(s,idx);
}
function renderFinalOpen(s){
  main.innerHTML = ticket(s, `
    <p>蠟燭的魔力進化成許願之力了！許下 3 個願望，將前 2 個說出來，第 3 個藏心裡。</p>
    <div class="candles mid" id="fc">${Array.from({length:MID},()=>candleHTML('lit')).join('')}</div>
    <progress class="nes-progress is-warning" id="mic" value="0" max="100"></progress>
    <button class="nes-btn is-primary btn" id="blow">吹熄蠟燭</button><button class="nes-btn is-success btn" id="wish" style="display:none">願望會實現！</button><div id="micmsg"></div>${npcBox(s,CONFIG.stages.indexOf(s))}
    ${state.npc?'<button class="nes-btn is-warning btn small" id="simblow" style="margin-top:8px">控制者：模擬吹熄 1 根</button>':''}`);
  let out=0;
  const extinguish=()=>{ const cs=document.querySelectorAll('#fc .candle.lit'); if(cs.length){ SND.sfx('candle_blow'); cs[cs.length-1].classList.remove('lit'); cs[cs.length-1].classList.add('out'); out++; } if(out>=MID){ $('#blow').style.display='none'; $('#wish').style.display=''; } };   // 全吹熄 → 出現「願望會實現！」
  $('#wish').onclick=renderSmoke;
  bindNpc(s,CONFIG.stages.indexOf(s));
  $('#blow').onclick=async()=>{
    try{
      const ms=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      actx = actx || new (window.AudioContext||window.webkitAudioContext)(); await actx.resume();
      const src=actx.createMediaStreamSource(ms), an=actx.createAnalyser(); an.fftSize=1024; src.connect(an);
      const buf=new Float32Array(an.fftSize); let acc=0, last=performance.now();
      $('#blow').style.display='none';   // 開始吹就把按鈕藏起來
      const loop=()=>{ if(out>=MID){ ms.getTracks().forEach(t=>t.stop()); return; } an.getFloatTimeDomainData(buf); let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i]; const rms=Math.sqrt(sum/buf.length); const now=performance.now(); if(rms>0.12){ acc+=now-last; if(acc>450){ extinguish(); acc=0; } } else acc=Math.max(0,acc-(now-last)*0.5); last=now; const m=$('#mic'); if(m) m.value=Math.min(100,rms*400); requestAnimationFrame(loop); };
      loop();
    }catch(e){ $('#micmsg').innerHTML=oops('麥克風打不開：'+(e.message||e)+'。請列車長用備援。'); }
  };
  const sb=$('#simblow'); if(sb) sb.onclick=()=>{ extinguish(); };
}
/* ── 麟光：第 7 根金色蠟燭 ── */
const sparkles=(n,w,h)=>Array.from({length:n},(_,i)=>`<i class="spk" style="left:${(i*37+11)%w}px;top:${(i*53+7)%h}px;animation-delay:${(i*.23)%1.2}s"></i>`).join('');
function renderGoldGift(s){   // 第 1 頁：列車長拿出金色蠟燭

  const tk=9, tw=TRAIN_ROWS[0].length*tk, gx=Math.round((W-(TCW+TLEAD+tw))/2), tx=gx+TCW+TLEAD, ty=H-44-TRAIN_ROWS.length*tk, tc=tx+tw*.78;   // 兩人站在車頂右邊，左邊放 7 根蠟燭（Ming 2026-11-06）   // 「三十而莉」＋捷運一組左右置中，中間距離＝字距（Ming 2026-11-06）   // 捷運往右，讓出左邊給「三十而莉」（Ming 2026-11-06）   // 捷運底部離下緣 42，日期緊貼車輪下；人物可以蓋到最後一張照片（Ming）
  const pk=5, ph2=window.MG_SPRITES.LILY.length*pk, py=ty-ph2+2;
  drawRows(g, TRAIN_ROWS, TRAIN_PAL, tx, ty, tk);
  const {LILY,LILY_PAL,MOMO_CAP,MOMO_CAP_PAL}=window.MG_SPRITES;
  drawRows(g, MOMO_CAP, MOMO_CAP_PAL, Math.round(tc+6-2*pk), py-(MOMO_CAP.length-LILY.length)*pk, pk);   // 拍貼用戴車長帽的墨墨（Ming：只有開頭信和拍貼戴帽）；身體左緣位置跟原本一樣、腳底對齊莉莉
  const LF=window.MG_SPRITES.LILY_FULL; drawRows(g, LF, LILY_PAL, Math.round(tc-6-LF[0].length*pk), py-(LF.length-LILY.length)*pk, pk);   // 戴帽全身版，底部對齊墨墨
  { const CR=['..L..','.LML.','.MMM.','.MDM.','..D..','..W..','.SSH.','.SSH.','.SSH.','.SSH.','.SSH.','.SSH.','.BBB.'], ck=4, gap=6;   // 車頂左邊 7 根蠟燭：第 1 根金色，燭火紅橙黃綠青藍紫
    const FL=[['#ff6b6b','#e8112d','#a4001a'],['#ffd8a8','#ff9f43','#d9681a'],['#fff6b0','#ffe066','#d9b21e'],['#c4f5cb','#66d678','#2e9e44'],['#c4f5f1','#3ad1c8','#16968f'],['#c9ddff','#4c8df0','#2459b8'],['#ead0ff','#b464e6','#7a32ad']];
    FL.forEach((f,i)=>{ const pal={L:f[0],M:f[1],D:f[2],W:'#333',S:i?'#f4c7a1':'#ffd34d',H:i?'#d9a074':'#e0a800',B:'#000'};
      drawRows(g, CR, pal, tx+22+i*(5*ck+gap), ty+2-CR.length*ck, ck); }); }
  g.textAlign='center';
  /* 2026-11-06 Ming：最上面改成像素字 20261126（顏色照原本標題圖）；「三十而莉」拆成 4 個大字，各壓在每張照片左下角、突出到照片外 */
  { const di=await load(STRIP_DATE_PNG), cuts=[[0,120],[126,246],[253,372],[379,497],[504,624],[630,750],[756,876],[882,1001]], dh=30, sp=12, sc=dh/di.height;   // 日期用 Ming 給的像素數字圖，逐字切開、小一點、字距 12px（Ming 2026-11-06）
    const ws=cuts.map(([a,b])=>Math.round((b-a)*sc)), tw=ws.reduce((t,w)=>t+w,0)+sp*(cuts.length-1); let x=Math.round((W-tw)/2);
    g.imageSmoothingQuality='high'; cuts.forEach(([a,b],i)=>{ const BALL=(window.MG_SPRITES.ICON_ART||{}).ball;
      if(i===1 && BALL){ const R=BALL.rows, on=R.map(r=>[...r].map(c=>c!=='.')), y0=on.findIndex(r=>r.some(v=>v)), y1=on.length-[...on].reverse().findIndex(r=>r.some(v=>v)), xs=on.flatMap(r=>r.map((v,j)=>v?j:-1)).filter(j=>j>=0), x0=Math.min(...xs), x1=Math.max(...xs)+1;
        const oc=document.createElement('canvas'); oc.width=x1-x0; oc.height=y1-y0; drawRows(oc.getContext('2d'), R, BALL.pal, -x0, -y0, 1);
        const bh=dh, bw=Math.round(bh*(x1-x0)/(y1-y0)); g.imageSmoothingEnabled=false; g.drawImage(oc, Math.round(x+(ws[i]-bw)/2), Math.round((head-dh)/2), bw, bh); g.imageSmoothingEnabled=true; }   // 排球上下貼齊其他數字（Ming）   // 2026 的 0 換成排球（Ming 2026-11-06）
      else g.drawImage(di, a, 0, b-a, di.height, x, Math.round((head-dh)/2), ws[i], dh); x+=ws[i]+sp; }); }
  if(CONFIG.stripTitleImg){ const ti=await load(CONFIG.stripTitleImg), cuts=TCUTS, ch=TCH;
    g.imageSmoothingQuality='high';
    const yb=H-44, lead=TLEAD;   // 「莉」下緣貼齊捷運輪子底   // 「莉」壓在最後一張照片左下角不動，「三十而」由上往下疊在它上面（Ming 2026-11-06）
    cuts.forEach(([x0,x1],i)=>{ const cw=Math.round((x1-x0)*ch/ti.height);
      g.drawImage(ti, x0, 0, x1-x0, ti.height, gx, yb-ch-(3-i)*(ch+lead), cw, ch); }); }
  // 2026-11-06 Ming：最底下的日期拿掉
  return c.toDataURL('image/jpeg',.92);
}

/* 網址帶 ?reset 清進度；?npc 直接開控制者介面（仍要密碼） */
if(location.search.includes('reset')) reset();
if(location.search.includes('npc')){ const pin=prompt('NPC 密碼'); if(pin===CONFIG.npcPin){ state.npc=true; save(); } history.replaceState(null,'',location.pathname); }
if(CONFIG.testMode){ state.npc=true; }
window.addEventListener('error', e=>{ if(!state.npc) return; let b=document.getElementById('errbox'); if(!b){ b=document.createElement('div'); b.id='errbox'; b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#e76e55;color:#fff;font-size:12px;padding:6px 10px;word-break:break-all'; document.body.appendChild(b); } b.textContent='錯誤：'+(e.message||e)+' @'+(e.lineno||''); });
setTimeout(()=>{ const fb=CONFIG.stages.find(x=>x.type==='firebadge'); if(fb && fb.mind && !state.done[fb.id]) arPreload(fb.mind); },4000);   // 開 App 幾秒後先把 AR 引擎與目標檔抓好
testBar();
updateBar();
render();
</script>
