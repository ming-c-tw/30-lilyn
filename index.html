<!-- NES.css：8-bit 介面元件（MIT） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nes.css/2.3.0/css/nes.min.css" integrity="sha384-O6AjLjfUmUlVtjVwX4WKPHE+6hSARLX8hRW1n+5w6b8dY0ED4fylO/udKa4UraEf" crossorigin="anonymous">
<!-- 縫合像素字體 12px 繁中版（OFL） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-tc@5.2.5/index.css" integrity="sha384-duFLEG3DQXStK7bFqdiq6VpoZJlHs+ew+R5nZTVXY1hlHErk9GYfELHWpVBQIdCN" crossorigin="anonymous">
<style>
  :root{
    --bg:#1d1f3b; --sky:#2b2d5e; --card:#fdf6e3; --ink:#212529; --muted:#6b6560;
    --brown:#8b5a2b; --red:#d7263d; --orange:#f29100; --blue:#209cee; --green:#1f8a4c;
    --gold:#f7d51d; --pink:#e76e8a;
    --px:4px;
  }
  *{box-sizing:border-box}
  html{font-size:12px;overflow-y:scroll;scrollbar-gutter:stable}  /* 右側捲動條位置一直預留，內容長短切換不跑版 */
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Fusion Pixel 12px Proportional TC","Press Start 2P","PingFang TC",system-ui,sans-serif;
    -webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;image-rendering:pixelated}
  body{min-height:100dvh;display:flex;flex-direction:column;font-size:16px;line-height:1.7;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.9) 0 1px, transparent 2px),
      radial-gradient(circle at 70% 25%, rgba(255,255,255,.7) 0 1px, transparent 2px),
      radial-gradient(circle at 45% 60%, rgba(255,255,255,.6) 0 1px, transparent 2px),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,.8) 0 1px, transparent 2px),
      radial-gradient(circle at 10% 85%, rgba(255,255,255,.5) 0 1px, transparent 2px);
    background-size:220px 220px}
  header{padding:calc(env(safe-area-inset-top) + 12px) 16px 6px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{font-size:20px;margin:0;letter-spacing:.1em;text-shadow:3px 3px 0 #000}
  header .time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000}
  /* 像素列車 */
  .rail{height:28px;position:relative;overflow:hidden;margin:0 0 8px;border-bottom:4px solid #0b0c1f}
  .rail svg{position:absolute;bottom:0;left:-120px;width:110px;height:26px;animation:ride 14s linear infinite;shape-rendering:crispEdges}
  @keyframes ride{to{transform:translateX(calc(100vw + 240px))}}
  main{flex:1;padding:0 12px 24px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
  .ticket.nes-container{background:var(--card);padding:1.6rem 1.2rem 1.2rem;position:relative}
  .ticket.nes-container.with-title>.title{background:var(--card);font-size:14px;color:var(--muted);letter-spacing:.1em}
  .station{display:flex;align-items:center;gap:10px;margin:0 0 4px;flex-wrap:wrap}
  .station .code{font-size:12px;color:#fff;background:var(--line-color,var(--blue));padding:4px 8px;box-shadow:var(--px) var(--px) 0 #000}
  .station .name{font-size:26px;letter-spacing:.08em}
  .station .name.route{font-size:19px;letter-spacing:.04em;white-space:nowrap;line-height:44px}   /* 路段關：起站 >> 到站，字縮小但列高跟一般站名一樣，版面不動 */
  .sub{color:var(--muted);font-size:14px;margin:0 0 10px}
  p{margin:8px 0}
  .nes-btn{border-image-repeat:stretch}
  .nes-btn.is-arrive{--arrive:var(--red);background:var(--arrive);color:#fff}   /* 已抵達專用：底色＝到站的路線色 */
  .nes-btn.is-arrive::after{box-shadow:inset -4px -4px color-mix(in srgb,var(--arrive),#000 28%)}
  .nes-btn.is-arrive:hover{background:color-mix(in srgb,var(--arrive),#fff 10%)}
  .nes-btn.is-arrive:focus{box-shadow:none}   /* NES.css 2.3 預設 space，邊框會變成一格一格的毛邊 */
  .btn{width:100%;margin:6px 0 0;font-size:16px}   /* NES.css 預設 margin 4px 會讓按鈕整個偏右 4px */
  .btn.small{width:auto;font-size:14px;padding:4px 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn{flex:1;width:auto}
  .nes-input{font-size:22px;text-align:center;letter-spacing:.3em;background:#fff}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  .candles{display:flex;justify-content:center;gap:12px;padding:8px 0 2px}
  .candle{width:24px;height:60px;position:relative;opacity:.3;transition:opacity .4s}
  .candle.lit{opacity:1}
  .candles.mid{gap:26px;margin:30px 0 14px}
  .candles.mid .candle{transform:scale(1.45);transform-origin:50% 100%;margin-top:28px}   /* 終局吹蠟燭／煙霧頁的 6 根 */
  .candles.big .candle{transform:scale(1.7);transform-origin:50% 100%;margin-top:42px}   /* 點亮頁的大蠟燭 */
  .candle .stick{position:absolute;bottom:0;left:6px;width:12px;height:36px;background:#f4c7a1;box-shadow:inset -4px 0 0 #d9a074, 0 4px 0 #000}
  .candle .wick{position:absolute;bottom:36px;left:11px;width:2px;height:6px;background:#333}
  .candle .flame{position:absolute;left:8px;top:2px;width:4px;height:4px;background:#ffe066;
    box-shadow:4px 0 #ffe066,0 4px #ffb703,4px 4px #ffb703,8px 4px #ffe066,0 8px #fb8500,4px 8px #ffb703,8px 8px #fb8500,4px 12px #fb8500;display:none}
  .candle.lit .flame{display:block;animation:flick .4s steps(2) infinite alternate}
  .candle.out .flame{display:none}
  .candle.out .smoke{position:absolute;left:10px;top:6px;width:4px;height:4px;background:#999;box-shadow:4px -6px #aaa,0 -12px #bbb;animation:rise 1.2s steps(3) infinite}
  @keyframes flick{from{transform:translateY(0)}to{transform:translateY(-2px) scaleX(1.1)}}
  @keyframes rise{to{transform:translateY(-10px);opacity:0}}
  .msg{margin:10px 0 6px;font-size:15px}
  .letter.nes-container{background:#fff9db;font-size:15px;line-height:2;white-space:pre-wrap;margin:10px 0 14px;padding:1rem}
  .nes-input{margin:0;width:100%}
  .hint{color:var(--muted);font-size:14px}
  .tag{font-size:13px;color:var(--muted)}
  .diffwrap{position:relative;width:100%;overflow:hidden;background:#ddd;touch-action:manipulation;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000}
  .diffwrap img,.diffwrap svg{display:block;width:100%;height:auto}
  .diffwrap img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .diffwrap.zv{touch-action:none}
  /* 灰藍按鈕（忠孝復興「偵查」，Ming 指定；跟眼睛準星同色系） */
  .nes-btn.is-slate{color:#fff;background-color:#6b84a0}
  .nes-btn.is-slate::after{box-shadow:inset -4px -4px #4a5f78}
  .nes-btn.is-slate:hover{color:#fff;background-color:#5f7793}
  .nes-btn.is-slate:hover::after{box-shadow:inset -6px -6px #4a5f78}
  .nes-btn.is-slate:focus{box-shadow:0 0 0 6px rgba(107,132,160,.3)}
  .nes-btn.is-slate:active:not(.is-disabled)::after{box-shadow:inset 4px 4px #4a5f78}
  .zv .zi{position:relative;transform-origin:0 0;will-change:transform}
  .zv .xh{position:absolute;width:44px;height:44px;pointer-events:none;transform-origin:50% 50%;
    filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px rgba(0,0,0,.45))}   /* 白邊＋淡陰影：在粉紅機台上也看得清楚 */
  .mark{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border:4px solid var(--green);box-shadow:0 0 0 3px #fff;pointer-events:none}
  .mark.miss{border-color:var(--red);animation:pop .4s forwards}
  @keyframes pop{to{opacity:0;transform:scale(1.5)}}
  video{width:100%;background:#000;display:block;border:4px solid #000}
  .frame{position:relative}
  .frame.ar{isolation:isolate;aspect-ratio:1;overflow:hidden;background:#000;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000}   /* MindAR 的 video／canvas 是負 z-index，要自己的堆疊層才看得到 */
  .frame .ar-found-text{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:18px;letter-spacing:.1em;color:var(--gold);text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
  .frame .overlay.ar-found.L{left:32%;top:40%}
  .frame .overlay.ar-found.R{left:68%;top:40%}   /* 往上放，不壓到下方的字 */
  .frame .overlay.ar-found{background:transparent;border:0;padding:0;box-shadow:none;animation:fbglow .5s steps(4) infinite alternate, arbob 1.2s steps(6) infinite alternate}
  @keyframes arbob{from{transform:translate(-50%,-50%) translateY(-8px)}to{transform:translate(-50%,-50%) translateY(8px)}}   /* 命中的半片徽章上下飄 */
  .frame .reticle{position:absolute;inset:14% 12%;border:4px dashed rgba(255,255,255,.85);pointer-events:none}
  .frame .overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;color:var(--gold);padding:14px 18px;font-size:28px;letter-spacing:.4em;text-align:center;border:4px solid var(--gold);animation:fadein .6s steps(4)}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .compass{width:176px;height:176px;margin:8px auto;position:relative;background:#fff;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000}
  .compass .needle{position:absolute;left:50%;top:50%;width:8px;height:76px;margin:-76px 0 0 -4px;background:var(--red);transform-origin:50% 100%;transition:transform .2s steps(6)}
  .compass .needle.good{background:var(--green)}
  .compass .n{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;color:var(--muted)}
  .swatch{display:inline-block;width:32px;height:32px;border:4px solid #000;vertical-align:middle;margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;aspect-ratio:1;background:#000;border:4px solid #000}
  .tile{background-size:300% 300%;background-repeat:no-repeat;cursor:pointer}
  .tile.sel{outline:4px solid var(--gold);outline-offset:-4px}
  .dials{display:flex;justify-content:center;gap:8px;margin:8px 0}
  .dial{width:54px;background:#fff;border:4px solid #000;box-shadow:var(--px) var(--px) 0 #000;text-align:center;user-select:none}
  .dial button{display:block;width:100%;border:0;background:transparent;font-size:16px;padding:4px;cursor:pointer;font-family:inherit}
  .dial .v{font-size:30px;padding:2px 0;color:var(--blue)}
  footer{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);text-align:center;color:#9aa0c8;font-size:12px}
  .npc.nes-container{margin-top:10px;background:#fff3cd;padding:.8rem}
  .npc h3{margin:0 0 8px;font-size:13px;color:#8a5a00}
  .npc .row{display:flex;gap:6px}
  .npc .ans{margin-top:8px}
  .npc .ans-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
  .npc .ans-row .tag{margin:0;word-break:break-all}
  .npc .ans-row .copy{flex:0 0 auto;margin:0;font-size:12px;padding:2px 8px}
  .npc .row .btn.small{flex:1;margin:0;font-size:12px;padding:4px 2px;white-space:nowrap;text-align:center}
  .photo{width:100%;display:block;border:4px solid #000}
  /* 可拖曳調整位置的照片框（4:3，跟拍貼每格一樣） */
  .pframe{position:relative;width:100%;aspect-ratio:4/3;border:4px solid #000;background:#222 no-repeat;background-size:cover;touch-action:none;cursor:grab;user-select:none}
  .pframe.drag{cursor:grabbing}
  .stripwrap{position:relative;width:60%;margin:0 auto;border:4px solid #000}
  .stripwrap img{display:block;width:100%}
  .stripwrap .slot{position:absolute;border:0;outline:2px dashed #fff;outline-offset:-2px}
  .stripwrap .slot.pframe{border:0}
  .stripwrap .slot.empty{background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .slot .px{position:absolute;top:-8px;right:-8px;width:26px;height:26px;padding:0;border:3px solid #000;background:#e76e55;color:#fff;font:inherit;font-size:16px;line-height:18px;cursor:pointer;z-index:2}
  .nes-progress{height:14px;margin:4px 0 8px}
  .steps{display:flex;gap:4px;margin:0 0 10px}
  .steps i{flex:1;height:8px;background:#ccc;box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
  .steps i.done{background:var(--green)}
  .steps i.now{background:var(--gold)}
  details summary{cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  body.noprog .candlebar,body.noprog .codebar{display:none}
  .candlebar{display:flex;justify-content:center;gap:6px;padding:4px 0 10px;margin:-4px 0 6px}
  .candlebar .candle{width:24px;height:60px;transform:scale(.62);transform-origin:50% 100%;margin:-22px -4px 0;opacity:1}
  .candlebar .candle:not(.lit) .stick{opacity:.4}
  .candlebar .candle .wick{background:#fff}
  .candlebar .candle .stick{box-shadow:inset -4px 0 0 #d9a074}
  .codebar{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
  .codebar span{width:34px;height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#0b0c1f;color:#4a4e7a;border:3px solid #4a4e7a}
  .codebar span.got{background:#fdf6e3;color:var(--blue);border-color:#000;box-shadow:3px 3px 0 #9a9a9a}
  body.testing{}
  #testbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;align-items:center;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:#f7d51d;border-top:4px solid #000}
  #testbar b{font-size:13px;white-space:nowrap}
  #testbar .nes-btn{flex:1;margin:0;font-size:14px;padding:4px 6px}
  .fb-slots{display:flex;justify-content:center;gap:0;margin:10px 0}
  .fb-slot{box-sizing:content-box;width:64px;height:128px;border:4px dashed #b9a98f;display:flex;align-items:center;justify-content:center;background:#fff9db}
  .fb-slot svg{flex:none}   /* 槽內半片徽章要剛好是完整 128px 的一半（64×128），不被擠扁 */
  .fb-slot.got{border-style:solid;border-color:#000}
  .fb-slot.L{border-right-width:2px}.fb-slot.R{border-left-width:2px}
  .fb-merge{display:flex;justify-content:center;margin:10px 0;animation:fbglow 1s steps(4) infinite alternate}
  .fb-tap{cursor:pointer;animation:fbglow .5s steps(4) infinite alternate, fbfloat 1.2s steps(6) infinite alternate}
  @keyframes fbfloat{from{transform:translateY(-8px)}to{transform:translateY(8px)}}   /* 合成後的徽章發光＋上下浮動，點它解封 */
  .hero{margin:30px 0}
  .hero>svg.mx{margin-left:auto;margin-right:auto}
  .hair-glow svg{animation:hairglow .9s steps(3) infinite alternate}
  .pin-orbit{position:relative;height:196px;display:flex;align-items:center;justify-content:center}   /* 軌道直徑 184，地標置中 */
  .po-pin{position:relative;z-index:1}
  .po-ring{position:absolute;left:50%;top:50%;width:184px;height:184px;margin:-92px 0 0 -92px;animation:orbit 3.2s steps(48) infinite;z-index:2;pointer-events:none}
  .po-hair{position:absolute;left:50%;top:0;transform:translate(-50%,-50%) rotate(45deg)}   /* 貓毛順著繞行方向（順時針，頂端往右） */
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes hairglow{from{filter:drop-shadow(0 0 2px #ffd36b)}to{filter:drop-shadow(0 0 6px #ffb53a) drop-shadow(0 0 2px #fff6d8)}}   /* 金色細光暈 */
  .fb-free{position:relative;margin:30px 0}
  .fb-free .fb-cat{display:flex;justify-content:center;margin-top:6px;animation:catout 1.1s steps(7) both, catsway 1.4s steps(6) 1.1s infinite alternate}
  @keyframes catout{from{transform:translateY(-120px) scale(.2) rotate(-540deg);opacity:0}30%{opacity:1}to{transform:translateY(0) scale(1) rotate(0)}}   /* 從徽章裡滾出來 */
  @keyframes catsway{from{transform:translateX(-34px) rotate(-6deg)}to{transform:translateX(34px) rotate(6deg)}}                                      /* 左右晃 */
  @keyframes fbglow{from{filter:drop-shadow(0 0 0 #ff7a00)}to{filter:drop-shadow(0 0 10px #ff7a00)}}
  .fire-sprite{width:140px;height:140px;display:block;margin:6px auto;animation:fsbob .5s steps(2) infinite alternate}
  @keyframes fsbob{from{transform:scale(1,1)}to{transform:scale(1.03,0.96)}}   /* 胖貓呼吸 */
  /* ── 次元惡魔：整頁亂碼／壞掉（body.glitch）＋打魔王場地 ── */
  body.glitch::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 4px),linear-gradient(90deg,rgba(255,42,109,.16),transparent 30%,transparent 70%,rgba(5,217,232,.16));mix-blend-mode:screen;animation:gl-scan 1.1s steps(6) infinite}
  body.glitch::after{content:'';position:fixed;left:0;right:0;height:14px;background:rgba(255,42,109,.38);pointer-events:none;z-index:999;animation:gl-bar .7s steps(5) infinite}
  body.glitch h1,body.glitch .ticket .station .name,body.glitch .ticket .sub{text-shadow:2px 0 #ff2a6d,-2px 0 #05d9e8}
  body.glitch main *:not(svg):not(svg *):not(.noglitch){text-shadow:var(--gx,2px) 0 rgba(255,42,109,.8),calc(var(--gx,2px) * -1) 0 rgba(5,217,232,.8)}   /* 全頁 RGB 重影 */
  .noglitch{position:relative;z-index:1000;text-shadow:none!important}   /* 召喚胖貓那行：不受雜訊影響 */
  .gl-layer{position:fixed;inset:0;pointer-events:none;z-index:998;overflow:hidden}
  .gl-layer i{position:absolute;display:block;mix-blend-mode:screen}
  @keyframes gl-shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-1px,2px)}100%{transform:translate(3px,0)}}
  @keyframes gl-scan{to{background-position:0 40px,0 0}}
  @keyframes gl-bar{0%{top:10%}30%{top:62%}60%{top:35%}100%{top:85%}}
  @keyframes gl-slice{0%{clip-path:inset(0)}33%{clip-path:inset(10% -4px 55% 4px)}66%{clip-path:inset(60% 4px 0 -4px)}100%{clip-path:inset(0)}}
  .arena{position:relative;z-index:1000;height:340px;margin:14px 0 0;border:4px solid #000;background:#140a22;box-shadow:var(--px) var(--px) 0 #000;overflow:hidden}   /* 疊在全頁雜訊上面：惡魔、胖貓不受影響 */
  .arena-bg{position:absolute;inset:0;background:#140a22}
  body.glitch .arena-bg{background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 4px),linear-gradient(90deg,rgba(255,42,109,.25),transparent 35%,transparent 65%,rgba(5,217,232,.25)),#140a22}
  .devil{position:absolute;right:16px;top:14px;width:112px;z-index:2;animation:devilbob .9s steps(2) infinite alternate}
  .devil svg{display:block}
  .devil .df2{position:absolute;left:0;top:0;visibility:hidden;animation:devflip .5s steps(1) infinite}
  .devil .df1{animation:devflip .5s steps(1) infinite reverse}
  .devil .dfh{position:absolute;left:0;top:0;visibility:hidden}
  .devil.hit .df1,.devil.hit .df2{visibility:hidden!important;animation:none}
  .devil.hit .dfh{visibility:visible;animation:hitflash .42s steps(1) 1}   /* 被揍時換成被揍圖，中間閃白兩下 */
  @keyframes hitflash{0%{filter:brightness(3) saturate(0)}20%{filter:none}40%{filter:brightness(3) saturate(0)}60%{filter:none}}
  @keyframes devflip{0%{visibility:hidden}50%{visibility:visible}}   /* 兩張輪替 */
  .devil.hit{animation:devilhit .16s steps(2) 1}
  .devil.die{animation:devildie 1.2s steps(8) forwards}
  @keyframes devilbob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
  @keyframes devilhit{0%{transform:translate(-10px,4px) rotate(-8deg)}100%{transform:translate(8px,-2px) rotate(6deg)}}
  @keyframes devildie{0%{opacity:1;transform:rotate(0) scale(1)}25%{opacity:.2;transform:translateY(10px) rotate(20deg)}50%{opacity:1;transform:translateY(40px) rotate(-30deg) scale(.8)}75%{opacity:.2;transform:translateY(120px) rotate(60deg) scale(.5)}100%{opacity:0;transform:translateY(240px) rotate(180deg) scale(.1)}}
  .cat{position:absolute;left:8px;bottom:8px;width:150px;z-index:3}
  .cat.rollin{animation:catout 1.1s steps(7) both}
  .fist{position:absolute;right:12px;bottom:12px;z-index:4;width:84px;height:84px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}   /* 圓形拳頭鈕（整顆是像素圖） */
  .sunset-btn.nes-btn,.sunset-btn.nes-btn:hover{color:#fff;text-shadow:2px 2px 0 #4a2a8f;background-color:#7b3fb0}   /* 領取通關證明：拍貼的紫色 */
  .sunset-btn.nes-btn::after{box-shadow:inset -4px -4px #4a2a8f}
  .fist:focus,.fist:focus-visible{outline:none}
  .fist svg{display:block;filter:drop-shadow(4px 4px 0 #000)}
  .fist:active svg{transform:translate(3px,3px);filter:drop-shadow(1px 1px 0 #000) brightness(.9)}
  .throwbox{margin-top:14px;text-align:center}
  .tb-badge{width:56px;margin:0 auto;touch-action:none;cursor:grab;animation:fbfloat 1.2s steps(6) infinite alternate}
  .tb-badge.drag{animation:none}
  .tb-badge.fly{animation:tbfly .55s steps(6) forwards}
  @keyframes tbfly{to{transform:translateY(-360px) rotate(720deg) scale(.3);opacity:0}}
  .dial{width:200px;height:200px;margin:34px auto 8px;position:relative;border:4px solid #000;border-radius:50%;background:radial-gradient(circle,#fff 60%,#fdf6e3 61%);box-shadow:4px 4px 0 #9a9a9a}
  .dial .mk{position:absolute;left:50%;top:50%;width:0;height:0}
  .dial .mk span{position:absolute;left:-16px;top:-96px;width:32px;height:32px;border:3px solid #000;background:#ffe066;display:flex;align-items:center;justify-content:center;font-size:18px}
  .dial .mk.flower span{background:#f4a3c0}
  .dial .mk.done span{opacity:.35}
  .dial .me{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
  .dial .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--muted)}
  .secret{font-size:30px;line-height:1;text-align:center;margin:30px 0 0;letter-spacing:.04em;color:#212529;text-shadow:3px 3px 0 #c9b98a}
  .bignum{font-size:96px;line-height:1;text-align:center;margin:12px 0 24px;color:var(--blue);text-shadow:6px 6px 0 #000}
  #gamebox{margin-top:14px}
  progress.nes-progress{display:block}
  .smoke-late{animation:latein .4s steps(2) 3.4s both}   /* 字跟按鈕等數字成形後才出現 */
  @keyframes latein{from{opacity:0}to{opacity:1}}
  .smoke-wrap{text-align:center;margin:6px 0 4px}
  .smoke-num{font-size:84px;line-height:1;color:#c9ccd6;text-shadow:0 0 12px #e0e3ea,4px 4px 0 #6b6f85;letter-spacing:.08em;animation:smokein 2.6s steps(10) 1s both;filter:blur(0)}   /* 先讓蠟燭冒煙 1 秒，煙再慢慢聚成數字 */
  @keyframes smokein{0%{opacity:0;filter:blur(10px);transform:translateY(30px) scale(.6)}60%{opacity:.7;filter:blur(4px)}100%{opacity:1;filter:blur(0);transform:none}}
  .big{font-size:22px;letter-spacing:.15em;color:var(--blue)}
  .px-icon{width:1.4em;height:1.4em;vertical-align:-0.3em;display:inline-block}
  .center{text-align:center}
</style>

(function applyAlt(){
  const m = new URLSearchParams(location.search).get('alt');
  const use = Object.assign({}, CONFIG.useAlt);
  if(m) m.split(',').forEach(p=>{ const [sid,alt]=p.split(':'); if(sid&&alt) use[sid]=alt; });
  Object.entries(use).forEach(([sid,alt])=>{
    const s = CONFIG.stages.find(x=>x.id===sid), a = CONFIG.altStages[alt];
    if(!s||!a||s.type==='final') return;
    const keep = { id:s.id, name:s.name, code:s.code, line:s.line, letter:s.letter };
    Object.keys(s).forEach(k=>delete s[k]); Object.assign(s, a, keep);
  });
})();

const PRELOAD_KEEP=[]; let preloadDone=false;
function preloadAhead(){
  if(preloadDone) return; const from=CONFIG.stages.findIndex(x=>x.id==='s4'); if(state.stage<from) return;
  preloadDone=true; const urls=new Set();
  CONFIG.stages.forEach(st=>(st.photos||[]).forEach(p=>{ if(p.image) urls.add(p.image); (p.qs||[]).forEach(q=>{ (q.choices||[]).forEach(c=>urls.add(c.img)); (q.seq||[]).forEach(it=>urls.add(it.img)); }); }));
  const list=[...urls]; let i=0;
  const next=()=>{ if(i>=list.length) return; const im=new Image(); im.decoding='async'; im.onload=im.onerror=()=>setTimeout(next,50); im.src=list[i++]; PRELOAD_KEEP.push(im); };   // 一張一張來，不搶目前頁面的頻寬
  setTimeout(()=>{ if(window.requestIdleCallback) requestIdleCallback(next,{timeout:3000}); else next(); }, 1500);   // 先讓目前頁面載完再開始
}

const STATION_COLOR = [['大安森林公園','red'],['麟光捷運站','brown'],['科技大樓','brown'],['忠孝新生','orange'],['忠孝復興','blue'],['東門','red'],['麟光','brown']];
const STATION_RE = new RegExp('(?:'+STATION_COLOR.map(x=>x[0]).join('|')+')站?','g');   // 後面接「站」也一起上色
function colorStations(root){
  const skip='button,.nes-btn,.station,input,textarea,svg,.mrt,h1,label,.npc,script,style';
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n=>{ STATION_RE.lastIndex=0; return (n.parentElement && !n.parentElement.closest(skip) && STATION_RE.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const f=document.createDocumentFragment(); let last=0; const t=n.nodeValue; STATION_RE.lastIndex=0; let m;
    while((m=STATION_RE.exec(t))){ f.appendChild(document.createTextNode(t.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='mrt'; sp.style.color=LINE[STATION_COLOR.find(x=>m[0].startsWith(x[0]))[1]]; sp.textContent=m[0]; f.appendChild(sp); last=m.index+m[0].length; }
    f.appendChild(document.createTextNode(t.slice(last))); n.replaceWith(f); });
}

let HIST=[], REDO=[], restoring=false;

function snapState(){ const c=JSON.parse(JSON.stringify(state)); delete c.npc; return JSON.stringify(c); }
function recordPage(){ if(!CONFIG.testMode || restoring) return; const sn=snapState(); if(HIST[HIST.length-1]!==sn){ HIST.push(sn); if(HIST.length>80) HIST.shift(); REDO=[]; try{ sessionStorage.setItem('mrt-hist', JSON.stringify(HIST)); }catch(e){} } }
function restoreSnap(sn){ const o=JSON.parse(sn); Object.keys(state).forEach(k=>{ if(k!=='npc') delete state[k]; }); Object.assign(state,o); restoring=true; save();
  const st=CONFIG.stages[state.stage];
  if(st && state.done[st.id] && !['game','firebadge','photo_task','final'].includes(st.type)){ stopCamera(); showLetter(st,true); }   // 過關畫面那一頁
  else if(!state.started) render(); else render();
  restoring=false; try{ sessionStorage.setItem('mrt-hist', JSON.stringify(HIST)); }catch(e){} }
function pageBack(){ if(HIST.length<2) return; REDO.push(HIST.pop()); restoreSnap(HIST[HIST.length-1]); }
function pageNext(){
  if(REDO.length){ const sn=REDO.pop(); HIST.push(sn); restoreSnap(sn); return; }
  const nx=document.getElementById('next'); if(nx){ nx.click(); return; }       // 過關畫面 → 前往下一站
  const nl=document.getElementById('nextl'); if(nl){ nl.click(); return; }     // 點亮蠟燭頁 → 目的地
  const wn=document.getElementById('won'); if(wn && wn.style.display!=='none'){ wn.click(); return; }   // 小遊戲打贏 → 看秘密數字
  const go=document.getElementById('go'); if(go){ go.click(); return; }          // 開場
  if(document.getElementById('fc') && !document.getElementById('gocode')){ renderSmoke(); setTimeout(recordPage,0); return; }   // 吹蠟燭 → 煙霧櫃號（跳過願望鈕）
  const gc=document.getElementById('gocode'); if(gc){ gc.click(); return; }
  const ol=document.getElementById('openletter')||document.getElementById('cert'); if(ol){ ol.click(); return; }   // 獲得一封信 → 看信 → 領取通關證明
  const s=CONFIG.stages[state.stage]; if(!s || state.done[s.id]) return;
  const step=(k,v)=>{ state.extra[k]=v; save(); render(); };
  if(s.type==='ticket_puzzle'){                                                  // 車票 → 合照 → 前往 → 拼圖 → 拼好 → 過關
    const k=s.id+'_tp', d=state.extra[k]||{step:'ticket'}, n=s.grid||3;
    if(d.step==='ticket') return step(k,{step:'photo'});
    if(d.step==='photo'){ state.extra[s.id+'_lit']=true; return step(k,{step:'lit'}); }
    if(d.step==='lit') return step(k,{step:'go'});
    if(d.step==='go'){ if(s.noPuzzle) return skipToNext(s); return step(k,{step:'puzzle', order:shuffle([...Array(n*n).keys()])}); }
    if(!d.solved){ d.order=[...Array(n*n).keys()]; d.solved=true; giveDigit(s.id); return step(k,d); }
    return skipToNext(s);
  }
  if(s.type==='photo_task'){ if(s.preStep && !state.extra[s.id+'_pre']){ state.extra[s.id+'_pre']=true; save(); return render(); } state.done[s.id]=true; save(); return render(); }
  if(s.type==='firebadge'){ const k=s.id+'_fb', d=state.extra[k]||{got:[]};
    if(!d.got.includes('winter')) d.got.push('winter'); else if(!d.got.includes('flower')){ d.got.push('flower'); d.summoned=true; state.done[s.id]=true; }
    state.extra[k]=d; save(); return render(); }
  if(s.type==='game'){ state.extra[s.id+'_won']=true; state.done[s.id]=true; save(); return render(); }
  if(s.type==='final'){ if(!state.extra.s7_blown){ state.extra.s7_blown=true; save(); return render(); } state.done[s.id]=true; state.stage=CONFIG.stages.indexOf(s)+1; save(); return render(); }
  if(s.type==='library'){                                                        // 已抵達 → 謎語 → 找書 → 過關
    const k=s.id+'_lib', st=state.extra[k]||'go';
    const order=['go','sit','riddle','riddle_ok','code','code_ok','find']; const i=order.indexOf(st);
    if(i<order.length-1) return step(k,order[i+1]);
    return pass(s);
  }
  pass(s);
}

/* 共用 UI */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function candleHTML(cls){ return `<div class="candle ${cls}"><div class="flame"></div><div class="smoke"></div><div class="wick"></div><div class="stick"></div></div>`; }
const MID = CONFIG.stages.filter(s=>s.type!=='final' && !s.transit && !s.noCandle).length; // 蠟燭數＝站內實境關各一根（含起點）
// 每過一關點一根；第一關（麟光）是上傳「出發！」合照時點
const CANDLE_IDS = CONFIG.stages.filter(s=>s.type!=='final' && !s.transit && !s.noCandle).map(s=>s.id);
const litCount = ()=>{ const first=CONFIG.stages[0].id; return (state.extra[first+'_lit']?1:0) + Object.keys(state.done).filter(k=>k!==first && CANDLE_IDS.includes(k)).length; };
function candles(){
  const lit = litCount();
  return `<div class="candles">${Array.from({length:MID},(_,i)=>candleHTML(i<lit?'lit':'')).join('')}</div>`;
}
function steps(){
  return `<div class="steps">${CONFIG.stages.map((s,i)=>`<i class="${state.done[s.id]?'done':(i===state.stage?'now':'')}"></i>`).join('')}</div>`;
}
function ticket(s, inner){

}
function hintBox(s){

/* 控制者看的解答（依關卡型別）；要輸入的答案附「複製」鈕 */
function answerNote(s){
  const items=[];                                   // {label, value, copy}
  if(s.type==='library'){ items.push({label:'書名',value:s.riddleAnswer,copy:true},{label:`索書號前 ${s.callDigits.length} 碼`,value:s.callDigits,copy:true},{label:'ISBN 後 3 碼',value:s.bookAnswer,copy:true}); }
  else if(s.type==='firebadge'){ items.push({label:'線索',value:s.clue},{label:'過關',value:'掃牆上的〈四季〉＋戶外的〈大安之花〉'}); }
  else if(s.type==='spot'){ (s.photos||[{spots:s.spots}]).forEach((p,i)=>{
      if(p.spots){ items.push({label:`照片 ${i+1}`,value:`${p.spots.length} 處 ${p.spots.map(q=>`(${q.x},${q.y})`).join(' ')}`}); return; }
      const qs=spotQs(p); if(!qs.length) items.push({label:`虛假空間 ${i+1}`,value:'（還沒設答案）'});
      qs.forEach((x,j)=>items.push({label:`虛假空間 ${i+1}${qs.length>1?`-${j+1}`:''}`,value:x.answers[0]||'（還沒設答案）',copy:!!x.answers.length})); }); }
  else if(s.type==='game' && s.game==='song'){ s.songs.forEach((x,i)=>items.push({label:`第 ${i+1} 首`,value:x.answers[0],copy:true})); }
  else if(s.type==='ticket_puzzle'){ items.push({label:'過關',value:'合照上傳就點蠟燭'}); }
  else if(s.type==='photo_task'){ items.push({label:'過關',value:s.preStep?`先按「${s.preStep.button}」再上傳合照`:'上傳合照就過'}); }
  else if(s.type==='director'){ items.push({label:'過關',value:'按「IG 總編給過」'}); }
  else if(s.type==='final'){ items.push({label:'櫃號',value:CONFIG.lockerNumber,copy:true},{label:'密碼',value:CODE_ORDER.map(k=>CONFIG.digits[k]).join(''),copy:true}); }
  if(!items.length) return '';
  return `<div class="ans">${items.map(it=>`<div class="ans-row"><span class="tag">${it.label}：<b>${it.value}</b></span>${it.copy?`<button class="nes-btn btn small copy" data-copy="${it.value}">複製</button>`:''}</div>`).join('')}</div>`;
}
function bindNpc(s, idx){
  if(!state.npc) return;
  $('#npcpass').onclick=()=>pass(s);
  const nw=$('#npcwin'); if(nw) nw.onclick=()=>{ if(window.__MG_WIN) window.__MG_WIN(); };   // 走遊戲自己的通關畫面
  // AR 關：控制者直接給左半／右半（兩半都有就跟真的掃到一樣，出現「解除封印」）
  const fbGive=key=>{ stopCamera(); const k=s.id+'_fb', d=state.extra[k]||{got:[]}; if(!d.got.includes(key)) d.got.push(key); state.extra[k]=d; save(); render(); };
  const nL=$('#npcL'); if(nL) nL.onclick=()=>fbGive('winter'); const nR=$('#npcR'); if(nR) nR.onclick=()=>fbGive('flower');
  // 忠孝復興：控制者直接算這張圖看破（最後一張就進魔王戰前的「已看破全部虛假」）
  const nph=$('#npcphoto'); if(nph) nph.onclick=()=>{ const k=s.id+'_quiz', d=state.extra[k]||{cur:0,step:'look'}; const n=(s.photos||[1]).length;
    Object.assign(d,{step:d.cur>=n-1?'all':'ok', got:spotQs((s.photos||[s])[d.cur]).map((_,i)=>i), open:null, seqi:0}); state.extra[k]=d; save(); render(); };
  document.querySelectorAll('.npc .copy').forEach(b=>b.onclick=async()=>{ const v=b.dataset.copy; try{ await navigator.clipboard.writeText(v); }catch(e){ const t=document.createElement('textarea'); t.value=v; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); } b.textContent='已複製'; setTimeout(()=>b.textContent='複製',1200); });
  $('#tbBack').onclick=pageBack; $('#tbNext').onclick=pageNext;
  $('#npcredo').onclick=()=>{ stopCamera(); clearStage(s.id); state.stage=idx; save(); render(); };   // 這關重來：只清這一關，從頭開始
  $('#npcback').onclick=()=>{
    // 回上一關：這一關和要回去的那一關都清乾淨，從頭開始
    clearStage(s.id); state.stage=Math.max(0,idx-1); clearStage(CONFIG.stages[state.stage].id); save(); render(); };
  $('#npcreset').onclick=()=>{ if(confirm('全部重來？')) reset(); };
  const nc=$('#npcclose'); if(nc) nc.onclick=()=>{ state.npc=false; save(); render(); };
}
function backupScanBox(){
  if(state.npc) return '';
  return `<details style="margin-top:10px"><summary class="tag">▸ 機器壞了？輸入備援密碼</summary>
    <div class="row" style="margin-top:6px;align-items:stretch"><input class="nes-input" type="password" id="bkpin" inputmode="numeric" placeholder="備援密碼" style="flex:1;font-size:18px"><button class="nes-btn btn small" id="bkbtn" style="margin:0">進入</button></div><div id="bkmsg"></div></details>`;
}
function bindBackupScan(s){
  const b=$('#bkbtn'); if(!b) return;
  const go=()=>{ if($('#bkpin').value===CONFIG.npcPin){ state.npc=true; save(); render(); } else $('#bkmsg').innerHTML=bad('密碼不對。'); };
  b.onclick=go; $('#bkpin').onkeydown=e=>{ if(e.key==='Enter') go(); };
}
function clearStage(id){
  delete state.done[id]; delete state.codes[id];
  Object.keys(state.extra).forEach(k=>{ if(k===id || k.startsWith(id+'_')) delete state.extra[k]; });
  if(state.extra.strip) delete state.extra.strip[id];
  const st=CONFIG.stages.find(x=>x.id===id); if(st && st.type==='director') delete state.extra.birthdayCard;
}
/* 上傳照片一律從相簿選：列出明確的圖片格式（不用 image/*），Android 會直接開相簿，不會跳出相機選項（Ming：開相機再關掉會卡住） */
const PHOTO_ACCEPT='image/jpeg,image/png,image/webp,image/heic,image/heif';
function savePhoto(key, theme, url){ state.extra.strip = state.extra.strip||{}; state.extra.strip[key]={theme,url,ox:.5,oy:.5}; save(); }
/* 照片框：背景圖 cover＋位置百分比（跟拍貼 drawImage 的裁法一樣），可拖曳 */
function photoFrame(key, extra=''){ const it=(state.extra.strip||{})[key]; if(!it||!it.url) return '';
  return `<div class="pframe" data-k="${key}" style="background-image:url(${it.url});background-position:${(it.ox??.5)*100}% ${(it.oy??.5)*100}%;${extra}"></div>`; }
function bindPframes(root, onEnd){
  (root||document).querySelectorAll('.pframe[data-k]').forEach(el=>{ const key=el.dataset.k, it=(state.extra.strip||{})[key]; if(!it||!it.url) return;
    let iw=0, ih=0; const im=new Image(); im.onload=()=>{ iw=im.width; ih=im.height; }; im.src=it.url;
    let st=null;
    el.addEventListener('pointerdown',e=>{ if(e.target.closest('.px')||!iw) return; e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); st={x:e.clientX,y:e.clientY,ox:it.ox??.5,oy:it.oy??.5}; });
    el.addEventListener('pointermove',e=>{ if(!st) return; const fw=el.clientWidth, fh=el.clientHeight, r=Math.max(fw/iw, fh/ih), ovx=iw*r-fw, ovy=ih*r-fh;
      it.ox=ovx>0.5?Math.min(1,Math.max(0,st.ox-(e.clientX-st.x)/ovx)):.5; it.oy=ovy>0.5?Math.min(1,Math.max(0,st.oy-(e.clientY-st.y)/ovy)):.5;
      el.style.backgroundPosition=`${it.ox*100}% ${it.oy*100}%`; });
    const end=()=>{ if(!st) return; st=null; el.classList.remove('drag'); save(); if(onEnd) onEnd(key); };
    el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); }); }
function cardBlock(){
  const u=state.extra.birthdayCard; if(!u) return '';
  return `<p class="center" style="margin:12px 0 4px">今天的生日卡</p><img class="photo" src="${u}" alt=""><a class="nes-btn btn small" style="display:inline-block;margin-top:8px" download="生日卡.jpg" href="${u}">⬇ 存到手機</a>`;
}
function showLetter(s, next){
  setTimeout(recordPage,0);
  const idx=CONFIG.stages.indexOf(s), nx=CONFIG.stages[idx+1];
  if(litStep(s,idx)) return;
  main.innerHTML = ticket(s, `${steps()}
    ${s.letter?`<p style="margin-top:12px">跟列車長拿信。</p><div class="letter nes-container is-rounded">${s.letter}</div>`:''}
    ${goNextHTML(s,idx)}${npcBox(s,idx)}`);

const litHTML=()=>`<div class="candles big hero" style="margin-bottom:24px">${candleHTML('lit')}</div>`;
function litStep(s, idx){                      // 回 true＝這次畫的是「成功點亮」頁；按下一步後 _go 記起來，下次 render 才給目的地
  if(state.extra[s.id+'_go']) return false;
  main.innerHTML = ticket(s, `${steps()}
    ${s.litStory?`<p>${s.litStory}</p>`:''}${ok(`成功點亮第 ${litCount()} 根蠟燭！`)}
    ${litHTML()}
    <button class="nes-btn is-success btn" id="nextl">下一步</button>
    ${backupScanBox()}${npcBox(s,idx)}`);
  $('#nextl').onclick=()=>{ state.extra[s.id+'_go']=true; save(); if(['game','firebadge','photo_task'].includes(s.type)) render(); else showLetter(s,true); };   // 一般關 render 會直接跳下一站，所以自己畫目的地頁
  bindBackupScan(s); bindNpc(s,idx); return true;
}
function arrivePage(s, idx){                   // 「已抵達 X」頁：大紅地標＋路線色按鈕
  const nx=CONFIG.stages[idx+1];
  main.innerHTML = ticket(s, `${steps()}
    ${s.arriveStory?`<p>${s.arriveStory}</p>`:''}${s.arriveHair?`<p class="center" style="font-size:20px;margin:16px 0 0">跟隨貓毛前往 <span class="big">${nx.name}</span></p>`:''}
    ${s.arriveHair?`<div class="hero pin-orbit"><div class="po-pin">${PIN_BIG}</div><div class="po-ring"><div class="po-hair hair-glow">${spriteSVG(HAIR_ROWS, HAIR_PAL, '44px', 'aria-label="發光的貓毛"')}</div></div></div>`:`<div class="hero" style="display:flex;justify-content:center">${PIN_BIG}</div>`}   <!-- 貓毛只在第一段（圖書館之後貓毛失去魔力） -->
    <button class="nes-btn is-arrive btn" id="next" style="--arrive:${LINE[nx.line]}">已抵達 ${nx.name}</button>
    ${backupScanBox()}${npcBox(s,idx)}`);
  $('#next').onclick=()=>{ state.extra[s.id+'_left']=true; state.stage=Math.min(idx+1,CONFIG.stages.length-1); save(); render(); };
  bindBackupScan(s); bindNpc(s,idx);
}
function goNextHTML(s, idx){
  const nx=CONFIG.stages[idx+1]; if(!nx) return '<button class="nes-btn is-primary btn" id="next" style="margin-top:14px">完成</button>';
  if(!nx.transit) return `${s.nextText?`<p style="margin-top:14px;font-size:18px">${s.nextText}</p>`:''}<button class="nes-btn is-success btn" id="next">${s.goBtn||'下一步'}</button>`;
  const dest=CONFIG.stages.slice(idx+1).find(x=>!x.transit)||nx;
  return `${s.goStory?`<p>${s.goStory}</p>`:''}<p class="center" style="font-size:${s.goLines?16:20}px;margin:16px 0">${s.goLines?s.goLines.join('<br>'):`${s.nextText||`${s.goVerb||'請前往'} <span class="big">${dest.name}</span>`}<br>並在路上進行秘密任務`}</p>
    ${s.goHair?`<div class="hero hair-glow">${spriteSVG(HAIR_ROWS, HAIR_PAL, '96px', 'class="mx" aria-label="發光的貓毛"')}</div>`:''}
    <button class="nes-btn is-primary btn" id="next">進行秘密任務</button>`;

let stream=null;
async function openCamera(container, facing='environment'){
  stopCamera();
  const v=el('<video playsinline muted autoplay></video>');
  container.innerHTML=''; container.appendChild(v);
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing }, audio:false });

  }catch(e){
    container.innerHTML = bad('打不開相機：'+(e.message||e)+'。要用 https 或加到主畫面，並允許相機。');

}
function stopCamera(){ if(colorTimer){ clearInterval(colorTimer); colorTimer=null; } if(arMind){ try{ arMind.stop(); }catch(e){} arMind=null; const c=document.getElementById('cam'); if(c) c.classList.remove('ar'); } if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
/* 顏色辨識：每 200ms 抓一張小圖，算粉紅／紅／藍像素比例；連續 3 次符合才算找到 */
let colorTimer=null;
function colorScan(video, spec, onFound){
  const dbg=window.__ARC={stage:'顏色辨識中',found:0,t0:Date.now(),pink:0,red:0,blue:0,ok:0};
  let box=document.getElementById('ardbg2'); if(!box){ const b1=document.getElementById('ardbg'); if(b1){ box=document.createElement('p'); box.className='tag'; box.id='ardbg2'; box.style.margin='4px 0 0'; b1.after(box); } }
  const show=()=>{ if(box) box.textContent=`花：${dbg.stage}｜粉 ${(dbg.pink*100).toFixed(1)}% 紅 ${(dbg.red*100).toFixed(1)}% 藍 ${(dbg.blue*100).toFixed(1)}%｜連續 ${dbg.ok}｜${Math.round((Date.now()-dbg.t0)/1000)}s`; };
  const c=document.createElement('canvas'); c.width=96; c.height=96; const g=c.getContext('2d',{willReadFrequently:true});
  const hsl=(r,gg,b)=>{ r/=255; gg/=255; b/=255; const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), l=(mx+mn)/2; if(mx===mn) return [0,0,l]; const d=mx-mn, sat=l>.5? d/(2-mx-mn) : d/(mx+mn); let h; if(mx===r) h=((gg-b)/d+(gg<b?6:0)); else if(mx===gg) h=(b-r)/d+2; else h=(r-gg)/d+4; return [h*60,sat,l]; };
  if(colorTimer) clearInterval(colorTimer);
  colorTimer=setInterval(()=>{
    if(!video.videoWidth){ return; }
    const vw=video.videoWidth, vh=video.videoHeight, m=Math.min(vw,vh);
    g.drawImage(video,(vw-m)/2,(vh-m)/2,m,m,0,0,96,96); const d=g.getImageData(0,0,96,96).data;
    let pink=0, red=0, blue=0, n=96*96;
    for(let i=0;i<d.length;i+=4){ const [h,sat,l]=hsl(d[i],d[i+1],d[i+2]); if(sat<.25) continue;
      if(h>=285 && h<=345 && l>.35) pink++; else if((h>=345||h<=12) && l>.2 && l<.7) red++; else if(h>=195 && h<=250 && l>.2) blue++; }
    dbg.pink=pink/n; dbg.red=red/n; dbg.blue=blue/n;
    const hit = dbg.pink>=spec.pink && dbg.red>=spec.red && dbg.blue<=spec.blueMax;
    dbg.ok = hit? dbg.ok+1 : 0; show();
    if(dbg.ok>=2){ clearInterval(colorTimer); colorTimer=null; dbg.found=1; dbg.stage='找到'; show(); onFound(); if(window.__AR){ window.__AR.by='顏色'; } }
  },200);
}
/* 預載：進到這一關就先把引擎（3 MB）跟目標檔抓下來，按掃描時立刻能用 */
const arBlob={};
async function arPreload(mindUrl){
  try{ if(!arThree) arThree = await import('./vendor/mindar/mindar-image-three.prod.js'); }catch(e){}
  if(mindUrl && !arBlob[mindUrl]){ try{ const r=await fetch(mindUrl); arBlob[mindUrl]=URL.createObjectURL(await r.blob()); }catch(e){} }
}
/* MindAR 影像辨識（官方 three.js 流程）：MindARThree 自己開相機、載目標、跑辨識，認出任何一張就 onFound */
let arMind=null, arThree=null;
async function arScan(container, mindUrl, onFound){
  const dbg=window.__AR={stage:'載入引擎',found:0,t0:Date.now()};
  const box=document.getElementById('ardbg'); const show=()=>{ if(box) box.textContent=`AR：${dbg.stage}｜命中 ${dbg.found}${dbg.by?'（'+dbg.by+'）':''}｜${Math.round((Date.now()-dbg.t0)/1000)}s`; };
  show();
  if(!arThree) arThree = await import('./vendor/mindar/mindar-image-three.prod.js');   /* 自己放：worker 要同網域 */
  // 目標檔自己先抓（顯示下載 %），抓完用 blob 交給 MindAR；預載過就直接用
  let blobUrl=arBlob[mindUrl];
  if(!blobUrl){
  const res=await fetch(mindUrl); const total=+res.headers.get('content-length')||0; const reader=res.body.getReader(); const chunks=[]; let got=0;
  while(true){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length; dbg.stage=`下載目標 ${total?Math.round(got/total*100)+'%':Math.round(got/1024)+'KB'}`; show(); }
  blobUrl=URL.createObjectURL(new Blob(chunks)); arBlob[mindUrl]=blobUrl; }
  dbg.stage='啟動相機'; show();
  container.innerHTML=''; container.classList.add('ar');
  const m=new arThree.MindARThree({ container, imageTargetSrc: blobUrl, uiLoading:'no', uiScanning:'no', uiError:'no', warmupTolerance: 5, missTolerance: 5 });   // warmup 拉高一點，減少誤判
  arMind=m;
  for(let i=0;i<8;i++){ try{ const an=m.addAnchor(i); an.onTargetFound=()=>{ dbg.found++; show(); onFound(i); }; }catch(e){ break; } }
  await m.start(); dbg.stage='辨識中'; show();
  const tick=()=>{ if(!arMind) return; show(); setTimeout(tick,500); }; tick();
}
function scanQR(container, onText){
  openCamera(container).then(v=>{
    if(!v) return;
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!stream) return;
      if(v.readyState===v.HAVE_ENOUGH_DATA){
        c.width=v.videoWidth; c.height=v.videoHeight; ctx.drawImage(v,0,0);
        const img=ctx.getImageData(0,0,c.width,c.height);
        const q = window.jsQR ? jsQR(img.data,img.width,img.height) : null;
        if(q && q.data){ if(onText(q.data)){ stopCamera(); return; } }
      }
      requestAnimationFrame(tick);
    };
    tick();
  });
}
function snapshot(v){ const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); return c; }

  let cur = photos.findIndex((p,i)=>(all[i]||[]).length < p.spots.length); if(cur<0) cur=photos.length-1;

  main.innerHTML = ticket(s, `${steps()}

  wrap.onclick=(e)=>{
    const r=wrap.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
    let hit=-1; ph.spots.forEach((p,i)=>{ if(Math.hypot(p.x-x,(p.y-y)*(r.height/r.width))<7 && !found.includes(i)) hit=i; });

function renderSpotQuiz(s, idx){

let geoWatch=null;
function renderGpsQr(s, idx){
  const arrived = !!state.extra.s1_arrived;
  main.innerHTML = ticket(s, `${steps()}
    <p>${s.intro}</p>
    <div id="geo">${arrived?ok('到了。'):info('定位中…走向圖書館大門。')}</div>
    <div id="dist" class="tag"></div>
    ${arrived?`<p style="margin-top:12px">索書號前半：<span class="big">${s.callNumberFront}</span><br><span class="tag">後半在列車長手上</span></p>
      <p>找到書以後，掃書裡的 QR。</p><div id="qr"></div><button class="nes-btn is-primary btn" id="scan">開相機掃 QR</button>`:''}
    ${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}
    ${state.npc?'<button class="nes-btn is-warning btn small" id="simarrive" style="margin-top:8px">控制者：模擬到達</button>':''}`);
  if(!arrived && navigator.geolocation){
    if(geoWatch) navigator.geolocation.clearWatch(geoWatch);
    geoWatch = navigator.geolocation.watchPosition(p=>{
      const d = haversine(p.coords.latitude,p.coords.longitude,s.target.lat,s.target.lng);
      const dEl=$('#dist'); if(dEl) dEl.textContent=`距離約 ${Math.round(d)} 公尺（誤差 ±${Math.round(p.coords.accuracy)}）`;
      if(d<=s.target.radius){ navigator.geolocation.clearWatch(geoWatch); state.extra.s1_arrived=true; save(); render(); }
    }, e=>{ const g=$('#geo'); if(g) g.innerHTML=bad('拿不到定位：'+e.message+'。請允許定位，或掃列車長的備援卡。'); }, { enableHighAccuracy:true, maximumAge:3000, timeout:15000 });
  }
  const sc=$('#scan'); if(sc) sc.onclick=()=>scanQR($('#qr'), t=>{ if(t===s.qrExpect){ pass(s); return true; } $('#qr').insertAdjacentHTML('afterbegin', bad('這張不是。')); return false; });
  const sim=$('#simarrive'); if(sim) sim.onclick=()=>{ state.extra.s1_arrived=true; save(); render(); };
  bindHints(s); bindBackupScan(s); bindNpc(s,idx);
}
function haversine(a,b,c,d){ const R=6371000, toR=x=>x*Math.PI/180; const dLat=toR(c-a), dLng=toR(d-b); const h=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

  if(!aligned){
    let goodSince=0;
    const start=()=>{
      if(oriHandler) window.removeEventListener('deviceorientation',oriHandler);
      oriHandler=(e)=>{
        let h = (e.webkitCompassHeading!=null)? e.webkitCompassHeading : (e.alpha!=null? (360-e.alpha)%360 : null);
        const deg=$('#deg'), nd=$('#needle'); if(!deg||!nd) return;
        if(h==null){ deg.textContent='這支手機拿不到方位'; return; }
        const rel = ((s.heading-h)+540)%360-180; // 目標相對於手機朝向
        nd.style.transform=`rotate(${rel}deg)`;
        const good=Math.abs(rel)<=s.headingTolerance;
        deg.textContent = good?'就是這個方向，往前走':`轉 ${rel>0?'右':'左'} ${Math.round(Math.abs(rel))}°`;
        nd.classList.toggle('good',good);
        if(good){ if(!goodSince) goodSince=Date.now(); if(Date.now()-goodSince>2000){ window.removeEventListener('deviceorientation',oriHandler); state.extra.s3_aligned=true; save(); render(); } } else goodSince=0;
      };
      window.addEventListener('deviceorientation',oriHandler);
    };
    $('#perm').onclick=async()=>{
      try{ if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){ const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') throw new Error('沒有允許'); } start(); $('#perm').textContent='羅盤啟用中'; }
      catch(e){ $('#geo').innerHTML=bad('羅盤啟用失敗：'+(e.message||e)); }
    };
    const sim=$('#simalign'); if(sim) sim.onclick=()=>{ state.extra.s3_aligned=true; save(); render(); };
  }else{
    const o=$('#open'); o.onclick=async()=>{
      const v=await openCamera($('#cam')); if(!v) return;
      o.textContent='拍下作品'; o.onclick=()=>{
        const c=snapshot(v); stopCamera(); c.className='photo'; $('#cam').innerHTML=''; $('#cam').appendChild(c);
        $('#pick').innerHTML='<p class="tag">點照片上那塊顏色。</p>';
        c.onclick=(e)=>{
          const r=c.getBoundingClientRect(); const x=Math.floor((e.clientX-r.left)/r.width*c.width), y=Math.floor((e.clientY-r.top)/r.height*c.height);
          const d=c.getContext('2d').getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data; let R=0,G=0,B=0,n=0; for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;}
          const hsl=rgb2hsl(R/n,G/n,B/n); const diff=Math.min(Math.abs(hsl.h-s.targetHue),360-Math.abs(hsl.h-s.targetHue));
          $('#pick').innerHTML=`<p class="tag">妳選的顏色 <span class="swatch" style="background:rgb(${R/n|0},${G/n|0},${B/n|0})"></span></p>`;
          if(hsl.s>0.18 && diff<=s.hueTolerance){ pass(s); } else $('#res').innerHTML=bad('不是這個顏色，再問列車長一題。');
        };
      };
    };
  }
  bindHints(s); bindBackupScan(s); bindNpc(s,idx);
}
function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const M=Math.max(r,g,b),m=Math.min(r,g,b); let h=0,s=0,l=(M+m)/2; if(M!==m){ const d=M-m; s=l>.5?d/(2-M-m):d/(M+m); h = M===r?((g-b)/d+(g<b?6:0)) : M===g?((b-r)/d+2) : ((r-g)/d+4); h*=60; } return {h,s,l}; }

/* 置中裁成 1:1 */
function ratioCrop(dataUrl, w, h, cb){   // 裁成 w:h（拍貼每格 4:3），置中取景
  const im=new Image(); im.onload=()=>{ let cw=im.width, ch=Math.round(im.width*h/w); if(ch>im.height){ ch=im.height; cw=Math.round(im.height*w/h); }
    const k=Math.min(1,1200/cw); const c=document.createElement('canvas'); c.width=Math.round(cw*k); c.height=Math.round(ch*k);
    c.getContext('2d').drawImage(im,(im.width-cw)/2,(im.height-ch)/2,cw,ch,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.9)); }; im.src=dataUrl; }
function squareCrop(dataUrl, size, cb){ shrink(dataUrl, 1400, cb); }   // 2026-11-05 改存原圖（長邊 1400），裁切位置另存 ox/oy，拍貼與照片框照位置裁（Ming：要能手動拉位置）
function _oldSquareCrop(dataUrl, size, cb){ ratioCrop(dataUrl, 4, 3, cb); }   // 舊呼叫點一律走 4:3（拍貼每格 4:3，Ming 2026-11-04）const im=new Image(); im.onload=()=>{ const m=Math.min(im.width,im.height); const c=document.createElement('canvas'); c.width=c.height=Math.min(size,m); c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.88)); }; im.src=dataUrl; }
function shrink(dataUrl, max, cb){ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*k|0; c.height=im.height*k|0; c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8)); }; im.src=dataUrl; }

    ${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}`);

  const f=$('#file'); if(f) f.onchange=(e)=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>shrink(rd.result,700,u=>{ state.extra.s5_img=u; state.extra.s5_order=shuffle([0,1,2,3,4,5,6,7,8]); save(); render(); }); rd.readAsDataURL(file); };

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } if(a.every((v,i)=>v===i)) [a[0],a[1]]=[a[1],a[0]]; return a; }
let actx=null;
function playTone(i){ // 示意音：正式版換成現場錄的到站音 audio 檔
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const seqs=[[523,659,784],[659,523,440,659],[784,784,659]]; let t=actx.currentTime; seqs[i].forEach(f=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.28); o.start(t); o.stop(t+.3); t+=.32; }); }catch(e){}
}

/* 備案 E 彩虹獵人：抽五色 → 限時拍照取色 → 集滿過關 */
let rbTimer=null;
function renderRainbow(s, idx){
  const k=s.id+'_rb'; let rb=state.extra[k];
  const hsl2css=h=>`hsl(${h} 85% 50%)`;
  if(!rb){
    main.innerHTML = ticket(s, `${steps()}<p>${s.intro}</p>
      <div class="candles" style="gap:6px">${s.palette.map(c=>`<span class="swatch" style="background:${hsl2css(c.h)};margin:0"></span>`).join('')}</div>
      <button class="nes-btn is-primary btn" id="draw">抽顏色、開始計時</button>${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}`);
    $('#draw').onclick=()=>{ const idxs=shuffle([...s.palette.keys()]).slice(0,s.pick); state.extra[k]={ colors:idxs, found:[], start:Date.now(), bought:0 }; save(); render(); };
    bindHints(s); bindBackupScan(s); bindNpc(s,idx); return;
  }
  const left = Math.max(0, s.seconds - Math.floor((Date.now()-rb.start)/1000));
  const fmt = t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  const done = rb.found.length>=rb.colors.length;
  main.innerHTML = ticket(s, `${steps()}
    <p class="center" style="font-size:30px;margin:4px 0;color:${left<60?'var(--red)':'var(--ink)'}" id="rbclock">${fmt(left)}</p>
    <div class="candles" style="gap:6px">${rb.colors.map(ci=>{ const c=s.palette[ci], f=rb.found.includes(ci); return `<div class="center"><span class="swatch" style="background:${hsl2css(c.h)};margin:0;opacity:${f?1:.25};outline:${f?'4px solid #000':'none'}"></span><div class="tag">${c.n}${f?' ✓':''}</div></div>`; }).join('')}</div>
    ${left>0 && !done ? `<div id="cam"></div><div id="pick"></div><div id="res"></div>
      <button class="nes-btn is-primary btn" id="open">${CAMERA} 拍一樣東西</button>
      <div class="row"><button class="nes-btn is-warning btn small" id="buy">跟列車長買提示（已買 ${rb.bought}）</button></div><div id="tip">${rb.lastTip?`<div class="letter nes-container is-rounded">${rb.lastTip}</div>`:''}</div>`
      : left<=0 && !done ? `${bad('時間到。')}<button class="nes-btn btn" id="again">重抽顏色再來一次</button>` : ''}
    ${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}
    ${state.npc&&!done&&left>0?'<button class="nes-btn is-warning btn small" id="simcolor" style="margin-top:8px">控制者：模擬拍到一色</button>':''}`);
  clearInterval(rbTimer);
  rbTimer=setInterval(()=>{ const l=Math.max(0, s.seconds - Math.floor((Date.now()-rb.start)/1000)); const c=$('#rbclock'); if(!c){ clearInterval(rbTimer); return; } c.textContent=fmt(l); if(l<=0){ clearInterval(rbTimer); render(); } },1000);
  const mark=(ci)=>{ rb.found.push(ci); state.extra[k]=rb; save(); if(rb.found.length>=rb.colors.length){ clearInterval(rbTimer); setTimeout(()=>pass(s),400); } else render(); };
  const o=$('#open'); if(o) o.onclick=async()=>{
    const v=await openCamera($('#cam')); if(!v) return;
    o.textContent='拍！'; o.onclick=()=>{
      const c=snapshot(v); stopCamera(); c.className='photo'; $('#cam').innerHTML=''; $('#cam').appendChild(c);
      $('#pick').innerHTML='<p class="tag">點照片上那塊顏色。</p>';
      c.onclick=(e)=>{
        const r=c.getBoundingClientRect(); const x=Math.floor((e.clientX-r.left)/r.width*c.width), y=Math.floor((e.clientY-r.top)/r.height*c.height);
        const d=c.getContext('2d').getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data; let R=0,G=0,B=0,n=0; for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;}
        const hsl=rgb2hsl(R/n,G/n,B/n);
        let hit=-1; rb.colors.forEach(ci=>{ if(rb.found.includes(ci)) return; const t=s.palette[ci].h; const diff=Math.min(Math.abs(hsl.h-t),360-Math.abs(hsl.h-t)); if(hsl.s>0.25 && hsl.l>0.15 && hsl.l<0.85 && diff<=s.hueTolerance) hit=ci; });
        $('#pick').innerHTML=`<p class="tag">妳選的顏色 <span class="swatch" style="background:rgb(${R/n|0},${G/n|0},${B/n|0})"></span></p>`;
        if(hit>=0){ $('#res').innerHTML=ok(`${s.palette[hit].n}色，收！`); setTimeout(()=>mark(hit),500); } else $('#res').innerHTML=bad('這個顏色不在彩虹裡，或太淡。');
      };
    };
  };
  const b=$('#buy'); if(b) b.onclick=()=>{ const t=s.npcTasks[rb.bought % s.npcTasks.length], tip=s.tips[rb.bought % s.tips.length]; rb.bought++; rb.lastTip=`列車長的小任務：${t}\n做完他才說：「${tip}」`; state.extra[k]=rb; save(); $('#tip').innerHTML=`<div class="letter nes-container is-rounded">${rb.lastTip}</div>`; b.textContent=`跟列車長買提示（已買 ${rb.bought}）`; };
  const ag=$('#again'); if(ag) ag.onclick=()=>{ delete state.extra[k]; save(); render(); };
  const sim=$('#simcolor'); if(sim) sim.onclick=()=>{ const ci=rb.colors.find(c=>!rb.found.includes(c)); if(ci!=null) mark(ci); };
  bindHints(s); bindBackupScan(s); bindNpc(s,idx);
}

/* 備案 導演關：抽風格卡 → 她指揮、NPC 用 App 相機拍三張 → 選一張套濾鏡定案 */
function renderDirector(s, idx){                 // 2026-11-03 簡化：不上傳，列車長拍到滿意就按「IG 總編給過」
  main.innerHTML = ticket(s, `${steps()}<p>${s.intro}</p>

function renderDirectorShoot(s, idx){            // 備案：原本的拍 3 張選 1 張＋色調＋壓字版，沒接上
  const k=s.id+'_dir'; let d=state.extra[k] || { shots:[], chosen:-1, filter:-1 };   // 風格卡已拿掉，直接開拍
  const stage = d.chosen>=0 ? 'edit' : (d.shots.length>=3 || d.picking) ? 'choose' : 'shoot';   // 拍 1 張就能選，最多 3 張
  main.innerHTML = ticket(s, `${steps()}
    ${stage==='shoot'?`<p>${s.intro}</p>
      <p class="tag">已拍 ${d.shots.length} / 3</p>
      <div class="row">${d.shots.map(u=>`<img src="${u}" style="width:30%;border:4px solid #000" alt="">`).join('')}</div>
      <label class="nes-btn ${d.shots.length?'':'is-primary'} btn" style="display:block;text-align:center">${CAMERA} ${d.shots.length?'再拍一張':'把手機交給列車長拍'}<input type="file" accept="${PHOTO_ACCEPT}" id="file" hidden></label>
      ${d.shots.length?'<button class="nes-btn is-primary btn" id="pickgo" style="margin-top:14px">選照片定案</button>':''}`
    : stage==='choose'?`<p>選 1 張最像妳要的。</p><div class="row">${d.shots.map((u,i)=>`<img data-i="${i}" class="pickshot" src="${u}" style="width:30%;border:4px solid #000;cursor:pointer" alt="">`).join('')}</div>`
    : `<img class="photo" id="final" src="${d.shots[d.chosen]}" style="filter:${d.filter>=0?s.styles[d.filter].filter:'none'}" alt="">
      <p class="tag">選一個色調</p><div class="row">${s.styles.map((x,i)=>`<button class="nes-btn btn small ${d.filter===i?'is-primary':''}" data-f="${i}">${x.n}</button>`).join('')}<button class="nes-btn btn small ${d.filter===-1?'is-primary':''}" data-f="-1">原色</button></div>
      <div class="row" style="margin-top:8px"><button class="nes-btn btn small" id="redo">重拍</button><button class="nes-btn is-primary btn" id="ok">定案，這就是今天的照片</button></div>`}
    ${hintBox(s)}${backupScanBox()}${npcBox(s,idx)}
    ${state.npc&&stage==='shoot'?'<button class="nes-btn is-warning btn small" id="simshot" style="margin-top:8px">控制者：模擬拍一張</button>':''}`);
  const f=$('#file'); if(f) f.onchange=(e)=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>shrink(rd.result, 1100, u=>{ d.shots.push(u); state.extra[k]=d; save(); render(); }); rd.readAsDataURL(file); };
  const pg=$('#pickgo'); if(pg) pg.onclick=()=>{ if(d.shots.length===1){ d.chosen=0; } else d.picking=true; state.extra[k]=d; save(); render(); };
  document.querySelectorAll('.pickshot').forEach(im=>im.onclick=()=>{ d.chosen=+im.dataset.i; state.extra[k]=d; save(); render(); });
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ d.filter=+b.dataset.f; state.extra[k]=d; save(); render(); });
  const rd=$('#redo'); if(rd) rd.onclick=()=>{ d.shots=[]; d.chosen=-1; d.filter=-1; d.picking=false; state.extra[k]=d; save(); render(); };
  const okb=$('#ok'); if(okb) okb.onclick=async()=>{
    // 套濾鏡、壓字，合成生日卡
    try{ await document.fonts.load('40px "Fusion Pixel 12px Proportional TC"'); }catch(e){}
    const im=new Image(); im.onload=()=>{
      const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d');
      g.filter = d.filter>=0 ? s.styles[d.filter].filter : 'none'; g.drawImage(im,0,0); g.filter='none';
      if(!s.cardText){ savePhoto(s.id, '導演作品', c.toDataURL('image/jpeg',.9)); save(); pass(s); return; }   // 沒設 cardText 就不壓字
      const W=c.width, H=c.height, band=Math.round(H*.26);
      const grad=g.createLinearGradient(0,H-band,0,H); grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,.75)'); g.fillStyle=grad; g.fillRect(0,H-band,W,band);
      const big=Math.round(W*.16), small=Math.round(W*.045);
      g.textAlign='center'; g.textBaseline='alphabetic';
      g.font=`${big}px "Fusion Pixel 12px Proportional TC","PingFang TC",sans-serif`;
      const px=Math.max(3,Math.round(big*.07));
      g.fillStyle='#000'; g.fillText(s.cardText, W/2+px, H-band*.38+px);
      g.fillStyle='#ffe066'; g.fillText(s.cardText, W/2, H-band*.38);
      g.font=`${small}px "Fusion Pixel 12px Proportional TC","PingFang TC",sans-serif`;
      g.fillStyle='#fff'; g.fillText(s.cardSub, W/2, H-band*.12);
      const url=c.toDataURL('image/jpeg',.9); if(s.cardText){ state.extra.birthdayCard=url; } savePhoto(s.id, '導演作品', url); save(); pass(s);
    }; im.src=d.shots[d.chosen];
  };
  const sim=$('#simshot'); if(sim) sim.onclick=()=>{ const c=document.createElement('canvas'); c.width=600; c.height=800; const g=c.getContext('2d'); g.fillStyle=`hsl(${Math.random()*360|0} 60% 70%)`; g.fillRect(0,0,600,800); g.fillStyle='#333'; g.fillRect(220,300,160,260); g.beginPath(); g.arc(300,250,70,0,7); g.fill(); d.shots.push(c.toDataURL('image/jpeg',.8)); state.extra[k]=d; save(); render(); };
  bindHints(s); bindBackupScan(s); bindNpc(s,idx);
}

/* 拍主題合照：上傳 → 成功點亮蠟燭 → 已抵達下一站 */
function renderPhotoTask(s, idx){
  const nx=CONFIG.stages[idx+1]; const shot=(state.extra.strip||{})[s.id];
  if(state.done[s.id] && s.finalPhoto) return state.extra.endLetter ? renderFinish() : state.extra.letterOpen ? renderEndLetter() : renderLetterIntro();
  if(state.done[s.id]){
    if(!s.noCandle && litStep(s,idx)) return;
    if(s.noCandle && state.extra[s.id+'_arrive']) return arrivePage(s,idx);
    main.innerHTML = ticket(s, `${steps()}
      ${s.noCandle?`<p>${s.noCandleText||''}</p><div class="center hero" style="margin-bottom:24px">${MOMO_SMIRK}</div>`:''}
      ${goNextHTML(s,idx)}
      ${backupScanBox()}${npcBox(s,idx)}`);
    $('#next').onclick=()=>{ if(s.noCandle){ state.extra[s.id+'_arrive']=true; save(); return render(); } state.extra[s.id+'_left']=true; state.stage=Math.min(idx+1,CONFIG.stages.length-1); save(); render(); };
    bindBackupScan(s); bindNpc(s,idx); return;
  }
  if(s.preStep && !state.extra[s.id+'_pre']){                      // 前置步驟（例：帶墨墨吃東西，他滿意了才拍照）
    main.innerHTML = ticket(s, `${steps()}
      ${s.intro?`<p>${s.intro}</p>`:''}
      ${s.preStep.icon?`<div class="center hero" style="margin-bottom:24px">${s.preStep.icon==='food'?FOOD:''}</div>`:''}
      <button class="nes-btn is-primary btn" id="pre">${s.preStep.button}</button>
      ${backupScanBox()}${npcBox(s,idx)}`);
    $('#pre').onclick=()=>{ state.extra[s.id+'_pre']=true; save(); render(); };
    bindBackupScan(s); bindNpc(s,idx); return;
  }
  main.innerHTML = ticket(s, `${steps()}
    ${s.intro && !s.preStep?`<p>${s.intro}</p>`:''}
    <p style="margin:4px 0 2px">${s.photoPrompt||'請拍一張合照，合照主題：'}</p>
    <p class="center" style="font-size:34px;margin:0 0 12px;color:var(--red)">${s.theme}</p>
    ${shot?photoFrame(s.id,'margin-bottom:14px'):''}
    <label class="nes-btn ${shot?'':'is-primary'} btn" style="display:block;text-align:center">${CAMERA} ${shot?'重新上傳':'上傳合照'}<input type="file" accept="${PHOTO_ACCEPT}" id="file" hidden></label>
    ${shot?'<button class="nes-btn is-primary btn" id="nextp" style="margin-top:14px">下一步</button>':''}
    ${backupScanBox()}${npcBox(s,idx)}`);
  $('#file').onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>squareCrop(rd.result, 1000, u=>{ savePhoto(s.id, s.theme, u); if(s.finalPhoto){ state.done[s.id]=true; save(); } render(); }); rd.readAsDataURL(f); };
  const np=$('#nextp'); if(np) np.onclick=()=>{ state.done[s.id]=true; save(); render(); };
  bindPframes(main); bindBackupScan(s); bindNpc(s,idx);
}

/* 火焰徽章：輪盤兩個方位 → AR 掃到兩半 → 合體 → 召喚火焰小精靈點亮蠟燭 */
let fbOri=null;
function renderFireBadge(s, idx){
  const k=s.id+'_fb'; const d=state.extra[k]||{got:[]};
  if(s.mind && !d.summoned) arPreload(s.mind);
  const nx=CONFIG.stages[idx+1];
  const has=key=>d.got.includes(key);
  if(fbOri){ window.removeEventListener('deviceorientation',fbOri); window.removeEventListener('deviceorientationabsolute',fbOri); fbOri=null; }
  // 拼好畫面
  if(d.summoned){
    if(!state.extra[s.id+'_free']){                     // 第 1 頁：胖貓從徽章滾出來、左右晃
      main.innerHTML = ticket(s, `${steps()}
        <div class="fb-free"><div class="fb-merge">${badgeSVG('','128px')}</div><div class="fb-cat">${SPRITE_SVG}</div></div>
        ${ok('封印解開了，胖貓自由了！')}
        <button class="nes-btn is-success btn" id="nextl" style="margin-top:16px">下一步</button>
        ${backupScanBox()}${npcBox(s,idx)}`);
      $('#nextl').onclick=()=>{ state.extra[s.id+'_free']=true; save(); render(); };
      bindBackupScan(s); bindNpc(s,idx); return;
    }
    if(litStep(s,idx)) return;                           // 第 2 頁：點亮蠟燭
    main.innerHTML = ticket(s, `${steps()}
      ${goNextHTML(s,idx)}
      ${backupScanBox()}${npcBox(s,idx)}`);
    $('#next').onclick=()=>{ state.extra[s.id+'_left']=true; state.stage=Math.min(idx+1,CONFIG.stages.length-1); save(); render(); };
    bindBackupScan(s); bindNpc(s,idx); return;
  }
  const both=has('winter')&&has('flower');
  main.innerHTML = ticket(s, `${steps()}
    <p>${s.story}</p>
    ${both?`<div class="fb-merge hero" style="animation:fbglow .5s steps(4) infinite alternate, fbfloat 1.2s steps(6) infinite alternate">${badgeSVG('',  '128px')}</div>
      <button class="nes-btn is-primary btn" id="summon">解除封印</button>`   /* 兩半合起來 → 按「解除封印」才進解封動畫（Ming） */
    :`<div class="fb-slots"><div class="fb-slot L ${has('winter')?'got':''}">${has('winter')?badgeSVG('L','64px'):'?'}</div><div class="fb-slot R ${has('flower')?'got':''}">${has('flower')?badgeSVG('R','64px'):'?'}</div></div>
      <div class="frame" id="cam" style="margin-top:14px"></div>
      <button class="nes-btn is-primary btn" id="scan" style="margin-top:14px">開啟異次元觀測器</button>`}
    <div class="letter nes-container is-rounded" style="font-size:17px;margin-top:14px">${(s.hints||[]).join('\n')}</div>   <!-- 提示直接全部顯示，放在按鈕下方（Ming） -->
    ${backupScanBox()}${npcBox(s,idx)}`);
  const perm=$('#perm'); if(perm) perm.onclick=async()=>{
    try{ if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){ const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') throw new Error('沒有允許'); }
      // 兩種事件都聽：absolute（真羅盤）優先；3 秒內有 absolute 就忽略相對的。iOS 用 webkitCompassHeading
      let lastAbs=0;
      fbOri=e=>{ const isAbs = e.type==='deviceorientationabsolute' || e.absolute===true || e.webkitCompassHeading!=null;
        if(isAbs) lastAbs=Date.now(); else if(Date.now()-lastAbs<3000) return;
        const h=(e.webkitCompassHeading!=null)? e.webkitCompassHeading : (e.alpha!=null? (360-e.alpha)%360 : null); if(h==null) return;
        document.querySelectorAll('#dial .mk').forEach(m=>{ m.style.transform=`rotate(${(+m.dataset.h - h + 360)%360}deg)`; });
        const dg=$('#deg'); if(dg) dg.textContent=`${Math.round(h)}°${isAbs?'':' (相對)'}`; };
      window.addEventListener('deviceorientationabsolute', fbOri); window.addEventListener('deviceorientation', fbOri);
      perm.textContent='輪盤啟用中'; perm.disabled=true;
    }catch(e){ perm.textContent='輪盤啟用失敗：'+(e.message||e); }
  };
  const sc=$('#scan'); if(sc) sc.onclick=async()=>{
    // 兩半同時找、不分先後：牆走 MindAR、花走顏色；哪個先命中就收哪一半
    const todo=s.targets.filter(t=>!has(t.key)); const flower=todo.find(t=>t.color); const keyOfIdx=i=>(s.targets.find(t=>(t.mindIdx||[]).includes(i))||{}).key;
    const found=(key)=>{ if(sc.dataset.done) return; sc.dataset.done=1; if(colorTimer){ clearInterval(colorTimer); colorTimer=null; }
      $('#cam').appendChild(el(`<div class="overlay ar-found ${key==='winter'?'L':'R'}">${badgeSVG(key==='winter'?'L':'R','64px')}</div>`));   // 半片＝完整徽章 128px 的一半（64px），跟合成後切半一樣大
      $('#cam').appendChild(el(`<div class="ar-found-text">找到${key==='winter'?'左':'右'}半邊了</div>`));                                     // 字置中在下方（el() 只回第一個元素，要分開加）
      sc.textContent='收下徽章'; sc.disabled=false; sc.className='nes-btn is-primary btn';                                   // 按了才跳下一步
      sc.onclick=()=>{ stopCamera(); d.got.push(key); state.extra[k]=d; save(); render(); }; };   // 兩半都到手後不自動解封，要點徽章
    sc.textContent='對準中…'; sc.disabled=true;
    try{
      let v=null;
      await arScan($('#cam'), s.mind, (i)=>{ const key=keyOfIdx(i); if(!key || has(key)) return; if(key==='winter'){ const c=window.__ARC; if(flower && c && c.pink>=flower.color.pink) return; }   // 畫面一片粉紅＝在花前面，牆的命中當誤判
        if(window.__AR) window.__AR.by='影像#'+i; found(key); }); v=arMind && arMind.video;
      if(flower && v) colorScan(v, flower.color, ()=>{ if(window.__AR) window.__AR.by='顏色'; found(flower.key); });
    }catch(e){ $('#cam').appendChild(el(`<div class="overlay" style="font-size:13px">辨識啟動失敗：${e.message||e}</div>`)); sc.textContent='再試一次'; sc.disabled=false; }
  };
  const sm=$('#summon'); if(sm) sm.onclick=()=>{ d.summoned=true; state.extra[k]=d; state.done[s.id]=true; save(); render(); };
  bindHints(s); bindBackupScan(s); bindNpc(s,idx);
}

/* 小遊戲關：玩贏 → 獲得數字 → 已抵達下一站 */
function renderGame(s, idx){
  if(gameCleanup){ gameCleanup(); gameCleanup=null; }
  const won=!!state.extra[s.id+'_won'], shown=!!state.extra[s.id+'_shown'];   // won＝打贏（畫面還留在遊戲上）、shown＝已按「已過關」看到數字
  const nx=CONFIG.stages[idx+1], nth=CODE_ORDER.indexOf(s.id)+1;

function drawSunset(g, W, H, deco){
  const bands=['#2b1b5e','#4a2a8f','#7b3fb0','#b04aa5','#e05a8e','#ff6f7d','#ff8a5c','#ffad66','#ffd08a','#ffe6b3'];

  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let i=0;i<40;i++){ const x=rnd()*W, y=rnd()*H; g.fillStyle='rgba(255,255,255,.9)'; g.fillRect(x,y,3,3); }
  deco.forEach(d=>drawRows(g, d.rows, d.pal, d.x, d.y, d.k));

function drawRows(g, rows, pal, x, y, k){ rows.forEach((r,yy)=>[...r].forEach((c,xx)=>{ if(c!=='.' && pal[c]){ g.fillStyle=pal[c]; g.fillRect(x+xx*k, y+yy*k, k, k); } })); }
/* 像素字：每個字分開用像素字型原生大小畫，去掉半透明邊、加粗，再每格放大 k 倍（含 1 格陰影）
   opt：{gap:字距(格), chars:{'字':{size:字型px, boldY:true＝上下也加粗}}}；y0～y1：整排字（含陰影）上下置中 */
function pixelText(g, txt, cx, y0, y1, k, col, shadow, opt={}){
  const glyphs=[...txt].map(ch=>{ const o=(opt.chars||{})[ch]||{}, sz=o.size||12;
    const c=document.createElement('canvas'), m=c.getContext('2d'), f=`${sz}px "Fusion Pixel 12px Proportional TC","PingFang TC",sans-serif`;
    m.font=f; const w=Math.ceil(m.measureText(ch).width)+4, h=sz+6; c.width=w; c.height=h;
    m.font=f; m.textBaseline='top'; m.fillStyle='#000'; m.fillText(ch,1,1);
    const d=m.getImageData(0,0,w,h).data, on=(x,y)=>x>=0&&y>=0&&d[(y*w+x)*4+3]>110, px=[];
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(on(x,y)||on(x-1,y)||(o.boldY&&(on(x,y-1)||on(x-1,y-1)))) px.push([x,y]);
    const xs=px.map(p=>p[0]), ys=px.map(p=>p[1]);
    return {px, l:Math.min(...xs), r:Math.max(...xs)+1, t:Math.min(...ys), b:Math.max(...ys)+1}; });

  const total=glyphs.reduce((s,q)=>s+(q.r-q.l),0)+gap*(glyphs.length-1)+1;  // +1 陰影
  const top=Math.min(...glyphs.map(q=>q.t+(base-q.b))), hh=base-top+1;
  const ty=Math.round(y0+(y1-y0-hh*k)/2)-top*k; let x=Math.round(cx-total*k/2);

  [[shadow,1],[col,0]].forEach(([fill,o])=>{ if(!fill) return; g.fillStyle=fill;
    place.forEach(({q,ox,oy})=>q.px.forEach(([px,py])=>g.fillRect(ox+(px+o)*k, ty+(py+oy+o)*k, k, k))); });
}

    drawSunset(g, W, H, [
      {rows:CLOUD_ROWS,pal:CP,x:14,y:150,k:3},{rows:CLOUD_ROWS,pal:CP,x:W-60,y:230,k:3},{rows:CLOUD_ROWS,pal:CP,x:W-56,y:560,k:2},{rows:CLOUD_ROWS,pal:CP,x:12,y:980,k:2},
      {rows:HEART_ROWS,pal:HP,x:16,y:420,k:3},{rows:HEART_ROWS,pal:HP2,x:W-38,y:400,k:3},{rows:HEART_ROWS,pal:HP,x:W-34,y:760,k:3},{rows:HEART_ROWS,pal:HP2,x:16,y:800,k:3},{rows:HEART_ROWS,pal:HP,x:18,y:1180,k:3},{rows:HEART_ROWS,pal:HP2,x:W-36,y:1120,k:3},{rows:HEART_ROWS,pal:HP,x:60,y:1300,k:4},{rows:HEART_ROWS,pal:HP,x:W-90,y:1320,k:4},{rows:HEART_ROWS,pal:HP2,x:W/2-10,y:1250,k:3},
      {rows:STAR_ROWS,pal:SP,x:40,y:40,k:3},{rows:STAR_ROWS,pal:SP,x:W-60,y:30,k:3},{rows:STAR_ROWS,pal:SP,x:W-40,y:300,k:2},{rows:STAR_ROWS,pal:SP,x:20,y:620,k:2},{rows:STAR_ROWS,pal:SP,x:W-30,y:900,k:2},{rows:STAR_ROWS,pal:SP,x:24,y:1420,k:3},{rows:STAR_ROWS,pal:SP,x:W-44,y:1440,k:3}
    ].map(d=>({...d, y:Math.round(d.y*ky)})));
  } else { g.fillStyle=T.bg; g.fillRect(0,0,W,H); }
  g.fillStyle=T.frame; g.fillRect(0,0,W,8); g.fillRect(0,H-8,W,8); g.fillRect(0,0,8,H); g.fillRect(W-8,0,8,H);   // 像素粗框
  /* 上方：捷運＋莉莉（戴生日帽）＋墨墨坐在車頂 */
  const load=u=>new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.src=u; });
  makeStrip.geo={W,H,pad,head,ph,pw,gap};   // 調整相片模式用來對位
  for(let i=0;i<Math.min(4,list.length);i++){
    const it=list[i], x=pad, y=head+i*(ph+gap);
    if(!T.noFrame){ g.fillStyle=T.frame; g.fillRect(x-4,y-4,pw+8,ph+8); }
    if(!it){ g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(x,y,pw,ph); continue; }
    const im=await load(it.url);
    const r=Math.max(pw/im.width, ph/im.height), sw=pw/r, sh=ph/r;
    g.drawImage(im,(im.width-sw)*(it.ox??.5),(im.height-sh)*(it.oy??.5),sw,sh,x,y,pw,ph);
  }
  if(T.sunset){ const HP={R:'#ff4d6d'}, HP2={R:'#ffc2d1'}, y1=head, y2=head+ph+gap, y3=head+(ph+gap)*2, y4=head+(ph+gap)*3;   // 故意蓋到照片邊角的愛心
    [{x:pad-10,y:y1+ph-16,k:4,pal:HP},{x:W-pad-18,y:y2-12,k:4,pal:HP2},{x:pad-12,y:y3+ph-20,k:4,pal:HP2},{x:W-pad-14,y:y4-10,k:4,pal:HP},{x:W-pad-20,y:y3+ph-14,k:3,pal:HP}].forEach(d=>drawRows(g, HEART_ROWS, d.pal, d.x, d.y, d.k)); }
  /* 捷運＋人物畫在照片之後，帽子會蓋在照片上 */
  const tk=9, tw=TRAIN_ROWS[0].length*tk, tx=Math.round((W-tw)/2), ty=H-42-TRAIN_ROWS.length*tk;   // 捷運底部離下緣 42，日期緊貼車輪下；人物可以蓋到最後一張照片（Ming）
  const pk=5, ph2=window.MG_SPRITES.LILY.length*pk, py=ty-ph2+2;
  drawRows(g, TRAIN_ROWS, TRAIN_PAL, tx, ty, tk);
  const {LILY,LILY_PAL,MOMO_CAP,MOMO_CAP_PAL}=window.MG_SPRITES;
  drawRows(g, MOMO_CAP, MOMO_CAP_PAL, Math.round(W/2+6-2*pk), py-(MOMO_CAP.length-LILY.length)*pk, pk);   // 拍貼用戴車長帽的墨墨（Ming：只有開頭信和拍貼戴帽）；身體左緣位置跟原本一樣、腳底對齊莉莉
  const LF=window.MG_SPRITES.LILY_FULL; drawRows(g, LF, LILY_PAL, Math.round(W/2-6-LF[0].length*pk), py-(LF.length-LILY.length)*pk, pk);   // 戴帽全身版，底部對齊墨墨
  g.textAlign='center';
  if(CONFIG.stripTitleImg){ const ti=await load(CONFIG.stripTitleImg); const th=66, tw2=Math.round(ti.width*th/ti.height);   // 標題用 GPT 畫的像素字圖，上框（8）到第一張照片之間置中
    g.imageSmoothingQuality='high'; g.drawImage(ti, Math.round((W-tw2)/2), Math.round(8+(head-8-th)/2), tw2, th); }
  else pixelText(g, CONFIG.stripTitle, W/2, 8, head, 4, T.title, T.shadow, CONFIG.stripTitleStyle);   // 沒有圖時改用程式畫的像素字
  const d=new Date(), ds=CONFIG.stripDate||`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; g.font=F(18); g.fillStyle=T.date; g.fillText(ds, W/2, H-18);   // 只留日期（Ming）
  return c.toDataURL('image/jpeg',.92);
}

/* 網址帶 ?reset 清進度；?npc 直接開控制者介面（仍要密碼） */
if(location.search.includes('reset')) reset();
if(location.search.includes('npc')){ const pin=prompt('NPC 密碼'); if(pin===CONFIG.npcPin){ state.npc=true; save(); } history.replaceState(null,'',location.pathname); }
if(CONFIG.testMode){ state.npc=true; }
window.addEventListener('error', e=>{ if(!state.npc) return; let b=document.getElementById('errbox'); if(!b){ b=document.createElement('div'); b.id='errbox'; b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#e76e55;color:#fff;font-size:12px;padding:6px 10px;word-break:break-all'; document.body.appendChild(b); } b.textContent='錯誤：'+(e.message||e)+' @'+(e.lineno||''); });
setTimeout(()=>{ const fb=CONFIG.stages.find(x=>x.type==='firebadge'); if(fb && fb.mind && !state.done[fb.id]) arPreload(fb.mind); },4000);   // 開 App 幾秒後先把 AR 引擎與目標檔抓好
testBar();
updateBar();
render();
</script>
